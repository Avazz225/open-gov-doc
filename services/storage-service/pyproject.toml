[project]
name = "storage-service"
version = "0.1.0"
description = "Storage-Abstraktionsschicht über austauschbare Backend-Plugins (Konzept 3.6)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aioboto3>=13.0",
    "dms-common",
    "dms-db-base",
    "dms-registry-client",
    "dms-retry",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-registry-client = { workspace = true }
dms-retry = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage_service"]
