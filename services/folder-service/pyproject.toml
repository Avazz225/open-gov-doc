[project]
name = "folder-service"
version = "0.1.0"
description = "Ordner-Hierarchie inkl. Struktur-Events für den Permission Service (Konzept 2.1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "dms-common",
    "dms-db-base",
    "dms-eventbus-client",
    "dms-registry-client",
    "dms-permission-client",
    "dms-metrics-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-eventbus-client = { workspace = true }
dms-registry-client = { workspace = true }
dms-permission-client = { workspace = true }
dms-metrics-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/folder_service"]
