[project]
name = "auth-service"
version = "0.1.0"
description = "OIDC-Broker vor Keycloak: Login/Refresh/Token-Validierung (Konzept 4.4)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-keycloak>=4.0",
    "dms-common",
    "dms-auth-client",
    "dms-registry-client",
    "dms-eventbus-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-auth-client = { workspace = true }
dms-registry-client = { workspace = true }
dms-eventbus-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_service"]
