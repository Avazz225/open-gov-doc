[project]
name = "plugin-orchestration-service"
version = "0.1.0"
description = "Plugin Orchestration Service Grundgeruest: Manifest-Format, Cold-Start-Platzierung, eigene minimale Ressourcen-Stichprobe (Konzept 3.8)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psutil>=6.0",
    "dms-common",
    "dms-db-base",
    "dms-eventbus-client",
    "dms-registry-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-eventbus-client = { workspace = true }
dms-registry-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_orchestration_service"]
