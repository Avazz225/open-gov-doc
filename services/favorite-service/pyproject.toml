[project]
name = "favorite-service"
version = "0.1.0"
description = "Persoenliche Favoriten/Merkliste fuer Dokumente und Ordner, schnelles Wiederfinden"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "dms-common",
    "dms-db-base",
    "dms-eventbus-client",
    "dms-registry-client",
    "dms-metrics-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-eventbus-client = { workspace = true }
dms-registry-client = { workspace = true }
dms-metrics-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/favorite_service"]
