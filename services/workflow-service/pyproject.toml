[project]
name = "workflow-service"
version = "0.1.0"
description = "Workflow Engine Grundgerüst: BPMN-Import/-Ausführung über SpiffWorkflow, Manual/Automatic Tasks (Konzept 7.1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "cryptography>=42.0",
    "SpiffWorkflow>=3.0,<4.0",
    "dms-common",
    "dms-db-base",
    "dms-eventbus-client",
    "dms-metrics-client",
    "dms-registry-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-eventbus-client = { workspace = true }
dms-metrics-client = { workspace = true }
dms-registry-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_service"]
