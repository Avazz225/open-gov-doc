[project]
name = "document-service"
version = "0.1.0"
description = "Dokumente: CRUD, dauerhafte Versionierung, Bearbeitungssperre inkl. Force-Unlock/Konfliktkopie (Konzept 2.1/2.1a/4.2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-magic>=0.4.27",
    "dms-common",
    "dms-db-base",
    "dms-eventbus-client",
    "dms-registry-client",
    "dms-metrics-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-eventbus-client = { workspace = true }
dms-registry-client = { workspace = true }
dms-metrics-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_service"]
