[project]
name = "webdav-connector"
version = "0.1.0"
description = "WebDAV-Referenz-Connector (Konzept 3.3, P12-S1): macht folder-service/document-service über WebDAV ansprechbar (Windows-Explorer/macOS-Finder/Word)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "wsgidav>=4.3",
    "asgiref>=3.8",
    "dms-common",
    "dms-registry-client",
    "dms-connector-sdk",
    "dms-metrics-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-registry-client = { workspace = true }
dms-connector-sdk = { workspace = true }
dms-metrics-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webdav_connector"]

[dependency-groups]
dev = ["webdav4>=0.10"]
