[project]
name = "permission-service"
version = "0.1.0"
description = "RBAC mit Ordner-Vererbung und ereignisgetriebenem Rechte-Cache (Konzept 4.1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "dms-common",
    "dms-db-base",
    "dms-eventbus-client",
    "dms-registry-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-eventbus-client = { workspace = true }
dms-registry-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/permission_service"]
