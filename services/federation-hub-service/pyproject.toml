[project]
name = "federation-hub-service"
version = "0.1.0"
description = "Federation Hub Grundgerüst: Adressbuch + Schaltzentrale für installationsübergreifende Workflow-Handover (Konzept 7.4, P6-S9)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "cryptography>=42.0",
    "dms-common",
    "dms-db-base",
    "dms-retry",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-retry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/federation_hub_service"]
