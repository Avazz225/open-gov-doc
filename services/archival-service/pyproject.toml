[project]
name = "archival-service"
version = "0.1.0"
description = "Aussonderung & Langzeitarchivierung von Dokumenten (Konzept 5.6): PDF/A-Transfer-Zustandsmaschine, Dehydrieren, auditierte Rückholung"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "cryptography>=42.0",
    "lxml>=5.0",
    "dms-common",
    "dms-db-base",
    "dms-registry-client",
    "dms-permission-client",
    "dms-retry",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-registry-client = { workspace = true }
dms-permission-client = { workspace = true }
dms-retry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archival_service"]
