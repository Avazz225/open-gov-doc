[project]
name = "object-type-service"
version = "0.1.0"
description = "Objekttyp-Definitionen (Attribute, Pflichtfelder, Constraints) + Validierungs-Endpunkt (Konzept 2.2/4.5)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "dms-common",
    "dms-db-base",
    "dms-constraint-engine",
    "dms-registry-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-constraint-engine = { workspace = true }
dms-registry-client = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/object_type_service"]
