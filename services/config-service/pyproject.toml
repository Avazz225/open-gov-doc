[project]
name = "config-service"
version = "0.1.0"
description = "Konfigurationsimport/-export (JSON, Schema-Versionierung), Konzept 7.3, P12-S3"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "dms-common",
    "dms-registry-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-registry-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config_service"]
