[project]
name = "notification-service"
version = "0.1.0"
description = "Notification Service: E-Mail/In-App/Webhook-Benachrichtigungen, Konsument von workflow.task.escalated (Konzept 7.1, P6-S2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "dms-common",
    "dms-db-base",
    "dms-eventbus-client",
    "dms-registry-client",
    "dms-retry",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-eventbus-client = { workspace = true }
dms-registry-client = { workspace = true }
dms-retry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]
