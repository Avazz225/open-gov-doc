[project]
name = "signature-service"
version = "0.1.0"
description = "Signature Service: eIDAS-konforme elektronische Signatur (SES/AES/QES), Broker vor externen QTSPs (Konzept 3.10, P6-S7)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "cryptography>=42.0",
    # `etsi`: EU trusted lists and ETSI validation reports (xsdata, signxml);
    # `async-http`: aiohttp fetchers, used on a fenced session (P92-S1/S2).
    "pyhanko[etsi,async-http]>=0.25",
    "aiohttp>=3.9",
    # File upload (trusted-list import, P92-S2).
    "python-multipart>=0.0.9",
    "dms-common",
    "dms-db-base",
    "dms-eventbus-client",
    "dms-registry-client",
    "dms-metrics-client",
    "dms-permission-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-eventbus-client = { workspace = true }
dms-registry-client = { workspace = true }
dms-metrics-client = { workspace = true }
dms-permission-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signature_service"]
