[project]
name = "ocr-service"
version = "0.1.0"
description = "OCR-Service: Worterkennung inkl. Wort-Bounding-Boxes für bildbasierte/gescannte Dokumente (Konzept 3.9)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pytesseract>=0.3.10",
    "pymupdf>=1.24",
    "Pillow>=10.4",
    "dms-common",
    "dms-db-base",
    "dms-eventbus-client",
    "dms-registry-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-eventbus-client = { workspace = true }
dms-registry-client = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.27", "reportlab>=4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_service"]
