[project]
name = "gateway-service"
version = "0.1.0"
description = "API-Gateway/BFF: Auth-Validierung, Rate Limiting, Routing über die Registry (Konzept 3.5)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "dms-common",
    "dms-auth-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-auth-client = { workspace = true }

[dependency-groups]
dev = ["cryptography>=42.0", "python-jose[cryptography]>=3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_service"]
