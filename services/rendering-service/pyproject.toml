[project]
name = "rendering-service"
version = "0.1.0"
description = "Rendering/Preview + Ersatzdarstellungen: Thumbnails, PDF/A, Wasserzeichen (Konzept 3.7/2.4)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "Pillow>=10.4",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "odfpy>=1.4",
    "pypdf>=4.3",
    "reportlab>=4.2",
    "dms-common",
    "dms-db-base",
    "dms-eventbus-client",
    "dms-registry-client",
    "dms-permission-client",
]

[tool.uv.sources]
dms-common = { workspace = true }
dms-db-base = { workspace = true }
dms-eventbus-client = { workspace = true }
dms-registry-client = { workspace = true }
dms-permission-client = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rendering_service"]
