server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # manifest.xml wird von Office direkt vom Web-Server geladen (Sideload/
    # Katalog-Verweis) - separat, nicht Teil des Next.js-Exports.
    location = /manifest.xml {
        default_type application/xml;
    }
}
