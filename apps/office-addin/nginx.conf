server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Directory-match requests (e.g. /login -> /login/) trigger nginx's
    # automatic trailing-slash redirect. Without this, the Location header
    # is an absolute URL built from listen/server_name (port 80, the
    # container-internal port) - correct inside the container, but wrong
    # for any client reaching this service through a mapped host port
    # (every app in this stack, see infra/docker-compose.yml's
    # *_PORT:80 mappings): the browser follows the redirect to port 80 on
    # the host, where nothing listens, and the request fails outright.
    absolute_redirect off;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # manifest.xml wird von Office direkt vom Web-Server geladen (Sideload/
    # Katalog-Verweis) - separat, nicht Teil des Next.js-Exports.
    location = /manifest.xml {
        default_type application/xml;
    }
}
