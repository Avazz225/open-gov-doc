[project]
name = "dms-cli"
version = "0.1.0"
description = "DMS-Kommandozeilenwerkzeug (Konzept 6.2) - Client gegen das API-Gateway, gleiche Rechte/Sicherungsstufen wie die Web-UIs"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
dms = "dms_cli.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_cli"]
