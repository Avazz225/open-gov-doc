[project]
name = "dms-workspace"
version = "0.0.0"
description = "Workspace-Root des DMS-Monorepos (kein eigenständiges Paket)"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["libs/*", "services/*", "tools/*"]
# `libs/dms-ui` (Phase 48 Session 1, ADR 0168) is a plain CSS file, not a
# Python package - it has no `pyproject.toml` and must not be discovered as
# a workspace member, or every `uv run`/`uv sync` (without `--frozen`) fails
# with "missing a pyproject.toml". Found live during Phase 50 Session 1
# (this glob had silently broken every `uv run` invocation since it was
# added - unnoticed because no session between P48-S1 and P50-S1 needed to
# run a backend Python test).
exclude = ["libs/dms-ui"]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.0", "pytest-asyncio>=0.24"]
notebook = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "requests>=2.34.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's `Depends(...)` in argument defaults is the intended idiom, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Ohne dies kollidieren gleichnamige Testmodule (z. B. test_repository.py) über
# verschiedene Services hinweg, da keines der tests/-Verzeichnisse ein
# __init__.py hat (siehe pytest-Doku zu "import mode").
addopts = "--import-mode=importlib"
