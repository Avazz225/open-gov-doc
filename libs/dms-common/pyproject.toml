[project]
name = "dms-common"
version = "0.1.0"
description = "Geteilte Basis für alle DMS-Services: Settings, strukturiertes Logging, Tracing-Grundlage"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.5",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_common"]
