[project]
name = "dms-auth-client"
version = "0.1.0"
description = "Zustandslose OIDC/JWT-Validierung gegen Keycloak (Konzept 4.4)"
requires-python = ">=3.12"
dependencies = [
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_auth_client"]
