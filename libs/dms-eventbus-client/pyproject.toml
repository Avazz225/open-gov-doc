[project]
name = "dms-eventbus-client"
version = "0.1.0"
description = "Austauschbares Event-Bus-Interface (Konzept 3.4), Werkseinstellung NATS JetStream"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.7",
    "pydantic>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_eventbus_client"]
