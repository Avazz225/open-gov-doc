[project]
name = "dms-db-base"
version = "0.1.0"
description = "Async-SQLAlchemy-Basis mit Schema-pro-Service-Konvention (Konzept 3.1)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = ["aiosqlite>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_db_base"]
