[project]
name = "dms-connector-sdk"
version = "0.1.0"
description = "Connector-Architektur (Konzept 3.3): wiederverwendbare DMS-Baum-Anbindung (Pfadauflösung, CRUD/Move/Lock) und Capability-Beschreibung für Connector-Services (WebDAV, künftig CMIS)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dms_connector_sdk"]
