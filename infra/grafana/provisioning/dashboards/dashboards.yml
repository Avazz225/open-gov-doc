# Declarative dashboard provisioning (concept 10.1, P11-S2) - loads every
# JSON file from infra/grafana/dashboards/ automatically at startup. The JSON
# files themselves are the "exportable dashboard templates" required by the
# concept - an operator can adopt them unchanged,
# customize them, or import them into their own Grafana instance (a starting point,
# not mandatory to use).
apiVersion: 1

providers:
  - name: dms-default-dashboards
    orgId: 1
    folder: DMS
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
