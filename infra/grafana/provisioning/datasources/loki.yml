# Logs (P94-S2, ADR 0251): Loki, fed by Alloy. A line with a `trace_id`
# links to the trace in Tempo (derived field).
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherType: regex
          matcherRegex: '"trace_id": "([0-9a-f]{32})"'
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: Trace öffnen
