# Declarative datasource provisioning (concept 10.1, P11-S2) - no
# manual setup in the Grafana UI needed. Points to the same
# `prometheus` service, which in turn exclusively scrapes `monitoring-service`
# (see docs/operations/monitoring.md).
apiVersion: 1

datasources:
  - name: Prometheus
    # Fixed uid, so the provisioned dashboard JSONs can reference it
    # directly without template variable mapping.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
