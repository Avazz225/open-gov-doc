{{/*
Bundled Postgres (P26-S3) — only rendered when postgresql.enabled=true
(otherwise every consumer points via dms.postgresDsn/dms.postgresHost to
postgresql.external.*, see templates/_helpers.tpl). Deliberately a simple
Deployment+PVC instead of a StatefulSet (an explicit, already-made v1
decision, see IMPLEMENTATION_PLAN.md Phase 26 and the session report) —
its own template instead of the generic services: mechanism, because volumes/
secret references/a differing health-check mechanism don't structurally fit
into the generic schema.

NO WAL archiving/no second WAL archive PVC/no chown init container
(unlike infra/docker-compose.yml, see the postgres comment there) -
a deliberate scope cut for this session: point-in-time recovery via a local
second volume is of limited use for a single-replica "no real cluster
deployment required in Phase 26" v1 chart (see ADR 0099 consequences), and
the Compose chown trick (fixed "postgres:postgres" user) isn't 1:1
transferable to OpenShift with a randomly assigned, non-root UID (restricted
SCC) anyway. An open point for a later session, should a
real cluster deployment actually become relevant (see the session report).
*/}}
{{- if .Values.postgresql.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dms.serviceFullname" (dict "root" . "name" "postgresql") }}-init
  labels:
    {{- include "dms.serviceLabels" (dict "root" . "name" "postgresql") | nindent 4 }}
data:
{{- (.Files.Glob "files/postgres-init/*.sql").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dms.serviceFullname" (dict "root" . "name" "postgresql") }}-data
  labels:
    {{- include "dms.serviceLabels" (dict "root" . "name" "postgresql") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.postgresql.persistence.storageClassName }}
  storageClassName: {{ .Values.postgresql.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgresql.persistence.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dms.serviceFullname" (dict "root" . "name" "postgresql") }}
  labels:
    {{- include "dms.serviceLabels" (dict "root" . "name" "postgresql") | nindent 4 }}
spec:
  replicas: 1
  # RWO PVC + single instance: during a rollout a second pod must never
  # try to mount the same volume simultaneously (no RollingUpdate overlap).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dms.serviceSelectorLabels" (dict "root" . "name" "postgresql") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dms.serviceSelectorLabels" (dict "root" . "name" "postgresql") | nindent 8 }}
    spec:
      containers:
        - name: postgresql
          image: {{ printf "%s%s:%s" .Values.global.image.registry .Values.postgresql.image.repository .Values.postgresql.image.tag | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dms.postgresSecretName" . }}
                  key: {{ include "dms.postgresSecretKey" . }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: {{ .Values.postgresql.resources.memory.requests | quote }}
              cpu: {{ .Values.postgresql.resources.cpu.requests | quote }}
            limits:
              memory: {{ .Values.postgresql.resources.memory.limits | quote }}
              cpu: {{ .Values.postgresql.resources.cpu.limits | quote }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "dms.serviceFullname" (dict "root" . "name" "postgresql") }}-data
        - name: init-scripts
          configMap:
            name: {{ include "dms.serviceFullname" (dict "root" . "name" "postgresql") }}-init
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dms.serviceFullname" (dict "root" . "name" "postgresql") }}
  labels:
    {{- include "dms.serviceLabels" (dict "root" . "name" "postgresql") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dms.serviceSelectorLabels" (dict "root" . "name" "postgresql") | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP
{{- end }}
