{{/*
Ein Deployment je Eintrag in .Values.services mit enabled=true.
Generisches Template — NEUE Services brauchen KEIN neues Template, nur einen
neuen Map-Eintrag in values.yaml (siehe Kommentar dort).

Seit P26-S3: `usesRedis: true` (analog `usesKeycloak`) injiziert
DMS_REDIS_URL via dms.redisUrl-Helper (bundled-only, siehe
templates/redis.yaml) — aktuell nur bei gateway-service gesetzt (ADR 0097).

Seit P26-S5:
- `healthCheckPath` (optional, Default "/healthz") steuert Liveness-/
  Readiness-Probe-Pfad. VORHER (P26-S1..S4) hatte dieses Template GAR KEINE
  Probes — echter, bislang unbemerkter Gap (jeder FastAPI-Service dieses
  Projekts hat laut docs/service-template.md/main.py einen `/healthz`-
  Endpunkt, siehe main.py jedes Services unter services/, aber kein Template
  dieses Charts hat ihn je verdrahtet). Wird in dieser Session behoben (Default
  "/healthz" deckt alle 32 bestehenden FastAPI-Services ohne
  values.yaml-Änderung ab), UND von den 6 neuen Next.js/nginx-Frontend-Apps
  (P26-S5) gebraucht, die explizit "/" setzen (kein FastAPI-Prozess, siehe
  deren values.yaml-Kommentar/ADR 0102).
- `staticFrontend: true` (nur bei den 6 Frontend-Apps gesetzt) lässt
  `helm template`/`helm lint` HART fehlschlagen, falls in `env:` trotzdem
  ein `NEXT_PUBLIC_*`-Eintrag steht — dieser würde vom bereits fertig
  gebauten statischen JS-Bundle schlicht ignoriert (Next.js backt
  NEXT_PUBLIC_*-Variablen beim `docker build` ein, nicht beim Container-
  Start), ein stiller Fehlschlag wäre hier schlimmer als ein lauter
  Chart-Fehler. Siehe ADR 0102.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dms.serviceFullname" (dict "root" $ "name" $name) }}
  labels:
    {{- include "dms.serviceLabels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "dms.serviceSelectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dms.serviceSelectorLabels" (dict "root" $ "name" $name) | nindent 8 }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ printf "%s%s:%s" $.Values.global.image.registry $svc.image.repository $svc.image.tag | quote }}
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
              protocol: TCP
          env:
            {{- include "dms.baseEnv" (dict "root" $ "name" $name) | nindent 12 }}
            {{- if $svc.dependsOnServices }}
            {{- include "dms.dependsOnServicesEnv" (dict "root" $ "deps" $svc.dependsOnServices) | nindent 12 }}
            {{- end }}
            {{- if $svc.usesKeycloak }}
            - name: DMS_KEYCLOAK_BASE_URL
              value: {{ include "dms.keycloakBaseUrl" $ | quote }}
            {{- end }}
            {{- if $svc.usesRedis }}
            - name: DMS_REDIS_URL
              value: {{ include "dms.redisUrl" $ | quote }}
            {{- end }}
            {{- if $svc.storageTargetsEnv }}
            {{- include "dms.storageServiceTargetsEnv" $ | nindent 12 }}
            {{- end }}
            {{- range $key, $value := $svc.env }}
            {{- if and $svc.staticFrontend (hasPrefix "NEXT_PUBLIC_" $key) }}
            {{- fail (printf "services.%s.env.%s: NEXT_PUBLIC_*-Variablen werden beim Next.js-Build per --build-arg eingebrannt (siehe apps/%s/Dockerfile), nicht zur Container-Laufzeit gelesen — ein hier gesetzter Wert hätte keinerlei Wirkung. Siehe ADR 0102." $name $key $name) }}
            {{- end }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- $resources := mergeOverwrite (deepCopy $.Values.resources.baseline) (default dict $svc.resources) }}
          resources:
            requests:
              memory: {{ $resources.memory.requests | quote }}
              cpu: {{ $resources.cpu.requests | quote }}
            limits:
              memory: {{ $resources.memory.limits | quote }}
              cpu: {{ $resources.cpu.limits | quote }}
          readinessProbe:
            httpGet:
              path: {{ $svc.healthCheckPath | default "/healthz" }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $svc.healthCheckPath | default "/healthz" }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
{{- end }}
{{- end }}
