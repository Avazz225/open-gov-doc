{{/*
Bundled MinIO (P26-S3) — nur gerendert, wenn minio.enabled=true (sonst zeigt
storage-service über dms.minioEndpoint auf minio.external.endpoint, siehe
templates/_helpers.tpl und storageService.targets in values.yaml).
*/}}
{{- if .Values.minio.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dms.serviceFullname" (dict "root" . "name" "minio") }}-data
  labels:
    {{- include "dms.serviceLabels" (dict "root" . "name" "minio") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.minio.persistence.storageClassName }}
  storageClassName: {{ .Values.minio.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dms.serviceFullname" (dict "root" . "name" "minio") }}
  labels:
    {{- include "dms.serviceLabels" (dict "root" . "name" "minio") | nindent 4 }}
spec:
  replicas: 1
  # RWO-PVC + Einzelinstanz, gleiche Begründung wie templates/postgresql.yaml.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dms.serviceSelectorLabels" (dict "root" . "name" "minio") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dms.serviceSelectorLabels" (dict "root" . "name" "minio") | nindent 8 }}
    spec:
      containers:
        - name: minio
          image: {{ printf "%s%s:%s" .Values.global.image.registry .Values.minio.image.repository .Values.minio.image.tag | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.auth.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dms.minioSecretName" . }}
                  key: {{ include "dms.minioSecretKey" . }}
          volumeMounts:
            - name: data
              mountPath: /data
          # infra/docker-compose.yml prüft über `mc ready local` (MinIO-CLI im
          # Image) - hier stattdessen die offiziell dokumentierten HTTP-
          # Health-Endpunkte des MinIO-Servers selbst, gleiche Semantik ohne
          # den CLI-Exec-Umweg.
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: {{ .Values.minio.resources.memory.requests | quote }}
              cpu: {{ .Values.minio.resources.cpu.requests | quote }}
            limits:
              memory: {{ .Values.minio.resources.memory.limits | quote }}
              cpu: {{ .Values.minio.resources.cpu.limits | quote }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "dms.serviceFullname" (dict "root" . "name" "minio") }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dms.serviceFullname" (dict "root" . "name" "minio") }}
  labels:
    {{- include "dms.serviceLabels" (dict "root" . "name" "minio") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dms.serviceSelectorLabels" (dict "root" . "name" "minio") | nindent 4 }}
  ports:
    - name: api
      port: 9000
      targetPort: api
      protocol: TCP
    - name: console
      port: 9001
      targetPort: console
      protocol: TCP
{{- end }}
