{{/*
Secrets für die Postgres-/Keycloak-/MinIO-Admin-Zugangsdaten (P26-S3, siehe
ADR 0100 "existingSecret-if-set-else-generate", Standard-Helm-Konvention).

Für jede der drei Komponenten gilt: ist `<component>.existingSecret` (bzw.
`<component>.external.existingSecret` im External-Fall) gesetzt, wird HIER
NICHTS generiert — das referenzierte Secret muss bereits im Cluster/
Namespace existieren (produktionstypisch von einem externen Mechanismus
verwaltet, z. B. External-Secrets-Operator/Sealed-Secrets/manuell vor
`helm install` angelegt) und den unten dokumentierten Key liefern. Ist es
NICHT gesetzt (Default), wird ein Secret aus dem Klartext-Passwort in
values.yaml generiert — reiner Dev-/Test-Komfort-Default (Parität zum
bestehenden Compose-Dev-Setup), NICHT für Produktion gedacht (siehe
values.yaml-Kommentar am jeweiligen Block).

Kein Secret für NATS/Redis: beide laufen in diesem Chart ohne Auth (analog
infra/docker-compose.yml), kein Passwort zu verwalten.
Kein generiertes Secret für den External-Postgres/-MinIO-Pfad: das Chart
kennt das Passwort einer externen Instanz nicht — dort MUSS
`<component>.external.existingSecret` gesetzt sein (siehe
templates/_helpers.tpl `dms.postgresSecretName`/`dms.minioSecretName`).
*/}}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dms.postgresSecretName" . }}
  labels:
    {{- include "dms.serviceLabels" (dict "root" . "name" "postgresql") | nindent 4 }}
type: Opaque
stringData:
  {{ include "dms.postgresSecretKey" . }}: {{ .Values.postgresql.auth.password | quote }}
{{- end }}
{{- if and .Values.keycloak.enabled (not .Values.keycloak.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dms.keycloakSecretName" . }}
  labels:
    {{- include "dms.serviceLabels" (dict "root" . "name" "keycloak") | nindent 4 }}
type: Opaque
stringData:
  {{ include "dms.keycloakSecretKey" . }}: {{ .Values.keycloak.admin.password | quote }}
{{- end }}
{{- if and .Values.minio.enabled (not .Values.minio.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dms.minioSecretName" . }}
  labels:
    {{- include "dms.serviceLabels" (dict "root" . "name" "minio") | nindent 4 }}
type: Opaque
stringData:
  {{ include "dms.minioSecretKey" . }}: {{ .Values.minio.auth.rootPassword | quote }}
{{- end }}
