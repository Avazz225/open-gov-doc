{{/*
CronJob that periodically triggers storage-service's real replication retry
endpoint (`POST /replication/process-pending`, services/storage-service/src/
storage_service/main.py line 561) from outside (P26-S4).
storage-service deliberately runs WITHOUT its own in-process scheduler for this (ADR
0004: explicit endpoint instead of in-process background task) — this CronJob
is the external carrier announced since post-roadmap Phase 20 Session 6
(see PROGRESS.md P20-S6).

Originally only ONE CronJob here, no second one for object fixity
verification — see ADR 0101: the endpoint that existed at the time
(`GET /object-verify/{key:path}/all`) needed a concrete object `key`
(verified all TARGETS of one object, not all objects in the store) and
therefore couldn't be called blindly on a periodic basis. Phase 40
Session 1 built the bulk endpoint ADR 0101's own "Consequences" section
recommended (`POST /object-verify/process-pending`) — the second
CronJob below now exists for exactly that endpoint, gated by its own
`storageCronJob.verification.enabled` (see values.yaml).

Lightweight curl image instead of the full storage-service image (see
the values.yaml storageCronJob.image comment) — the container does nothing
more than a single authenticated HTTP POST.
*/}}
{{- if .Values.storageCronJob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dms.fullname" . }}-storage-replication
  labels:
    {{- include "dms.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-replication-cronjob
spec:
  schedule: {{ .Values.storageCronJob.replication.schedule | quote }}
  # Prevents overlapping runs against the same storage-service instance
  # (the retry queue itself is idempotent, but two concurrent
  # batches would unnecessarily compete for the same "pending" rows).
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.storageCronJob.replication.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.storageCronJob.replication.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # Hard-aborts a hung run (e.g. storage-service or a
      # redundancy target unreachable) instead of waiting indefinitely.
      activeDeadlineSeconds: {{ .Values.storageCronJob.replication.activeDeadlineSeconds }}
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "dms.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: storage-replication-cronjob
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger-replication
              image: {{ printf "%s%s:%s" .Values.global.image.registry .Values.storageCronJob.image.repository .Values.storageCronJob.image.tag | quote }}
              imagePullPolicy: {{ .Values.global.image.pullPolicy }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  curl -sS -f --connect-timeout 5 --max-time 60 --retry 2 --retry-delay 3 \
                    -X POST \
                    -H "X-DMS-Principal: ${PRINCIPAL}" \
                    "${STORAGE_BASE_URL}/replication/process-pending?limit=${LIMIT}"
              env:
                - name: STORAGE_BASE_URL
                  value: {{ include "dms.storageServiceBaseUrl" . | quote }}
                - name: LIMIT
                  value: {{ .Values.storageCronJob.replication.limit | quote }}
                - name: PRINCIPAL
                  value: {{ .Values.storageCronJob.principalHeader | quote }}
              resources:
                requests:
                  memory: {{ .Values.storageCronJob.resources.memory.requests | quote }}
                  cpu: {{ .Values.storageCronJob.resources.cpu.requests | quote }}
                limits:
                  memory: {{ .Values.storageCronJob.resources.memory.limits | quote }}
                  cpu: {{ .Values.storageCronJob.resources.cpu.limits | quote }}
{{- end }}
{{- if .Values.storageCronJob.verification.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "dms.fullname" . }}-storage-verification
  labels:
    {{- include "dms.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-verification-cronjob
spec:
  schedule: {{ .Values.storageCronJob.verification.schedule | quote }}
  # Same rationale as the replication CronJob above - the bulk sweep
  # itself is idempotent (next_verify_at reschedules regardless), but two
  # concurrent runs would unnecessarily compete for the same objects.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.storageCronJob.verification.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.storageCronJob.verification.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      # A fixity sweep re-reads/re-hashes content on every configured
      # target for each selected object - allow more headroom than the
      # lightweight replication retry above before hard-aborting a hung
      # run.
      activeDeadlineSeconds: {{ .Values.storageCronJob.verification.activeDeadlineSeconds }}
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "dms.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: storage-verification-cronjob
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger-verification
              image: {{ printf "%s%s:%s" .Values.global.image.registry .Values.storageCronJob.image.repository .Values.storageCronJob.image.tag | quote }}
              imagePullPolicy: {{ .Values.global.image.pullPolicy }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  curl -sS -f --connect-timeout 5 --max-time 300 --retry 2 --retry-delay 3 \
                    -X POST \
                    -H "X-DMS-Principal: ${PRINCIPAL}" \
                    "${STORAGE_BASE_URL}/object-verify/process-pending?limit=${LIMIT}"
              env:
                - name: STORAGE_BASE_URL
                  value: {{ include "dms.storageServiceBaseUrl" . | quote }}
                - name: LIMIT
                  value: {{ .Values.storageCronJob.verification.limit | quote }}
                - name: PRINCIPAL
                  value: {{ .Values.storageCronJob.principalHeader | quote }}
              resources:
                requests:
                  memory: {{ .Values.storageCronJob.resources.memory.requests | quote }}
                  cpu: {{ .Values.storageCronJob.resources.cpu.requests | quote }}
                limits:
                  memory: {{ .Values.storageCronJob.resources.memory.limits | quote }}
                  cpu: {{ .Values.storageCronJob.resources.cpu.limits | quote }}
{{- end }}
