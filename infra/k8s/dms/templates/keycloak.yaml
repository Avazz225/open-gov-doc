{{/*
Bundled Keycloak (P26-S3) — only rendered when keycloak.enabled=true (otherwise
every consumer points via dms.keycloakBaseUrl to keycloak.external.baseUrl,
see templates/_helpers.tpl). Uses the same Postgres instance as the
stateless services (dms.postgresHost/-Port/-Database/-Username/
dms.postgresSecretName automatically respect postgresql.enabled
bundled vs. external, just like DMS_POSTGRES_DSN above) — the exact same
architecture as infra/docker-compose.yml ("Keycloak uses the same
Postgres instance, its own schema, no separate DB server").

No PersistentVolumeClaim for Keycloak itself — see the values.yaml comment
on the keycloak block (business state lives entirely in Postgres).
*/}}
{{- if .Values.keycloak.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dms.serviceFullname" (dict "root" . "name" "keycloak") }}
  labels:
    {{- include "dms.serviceLabels" (dict "root" . "name" "keycloak") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "dms.serviceSelectorLabels" (dict "root" . "name" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dms.serviceSelectorLabels" (dict "root" . "name" "keycloak") | nindent 8 }}
    spec:
      containers:
        - name: keycloak
          image: {{ printf "%s%s:%s" .Values.global.image.registry .Values.keycloak.image.repository .Values.keycloak.image.tag | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          # Dev mode, exactly like infra/docker-compose.yml (`command: start-dev`)
          # - see the comment there on realm import/production mode.
          args: ["start-dev"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.admin.username | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dms.keycloakSecretName" . }}
                  key: {{ include "dms.keycloakSecretKey" . }}
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: {{ printf "jdbc:postgresql://%s:%s/%s?currentSchema=keycloak" (include "dms.postgresHost" .) (include "dms.postgresPort" .) (include "dms.postgresDatabase" .) | quote }}
            - name: KC_DB_USERNAME
              value: {{ include "dms.postgresUsername" . | quote }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dms.postgresSecretName" . }}
                  key: {{ include "dms.postgresSecretKey" . }}
          # No curl/wget in the Keycloak image (see the infra/docker-compose.yml
          # comment, solved there via a raw /dev/tcp bash trick) - a
          # simple tcpSocket probe on the HTTP port is sufficient here
          # (the probe mechanism isn't a version-/config-relevant setting like
          # image/port/env, but pure k8s infrastructure). Generous
          # initialDelaySeconds/failureThreshold: Keycloak's JVM startup takes
          # noticeably longer than the lean FastAPI services.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              memory: {{ .Values.keycloak.resources.memory.requests | quote }}
              cpu: {{ .Values.keycloak.resources.cpu.requests | quote }}
            limits:
              memory: {{ .Values.keycloak.resources.memory.limits | quote }}
              cpu: {{ .Values.keycloak.resources.cpu.limits | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dms.serviceFullname" (dict "root" . "name" "keycloak") }}
  labels:
    {{- include "dms.serviceLabels" (dict "root" . "name" "keycloak") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dms.serviceSelectorLabels" (dict "root" . "name" "keycloak") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
{{- end }}
