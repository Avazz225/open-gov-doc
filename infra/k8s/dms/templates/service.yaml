{{/*
Ein ClusterIP Service je Eintrag in .Values.services mit enabled=true.
Name folgt exakt der Deployment-selector-Konvention (dms.serviceSelectorLabels),
damit jeder Service ausschließlich seine eigenen Pods trifft.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dms.serviceFullname" (dict "root" $ "name" $name) }}
  labels:
    {{- include "dms.serviceLabels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "dms.serviceSelectorLabels" (dict "root" $ "name" $name) | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
