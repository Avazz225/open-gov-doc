        secretName: "office-addin-tls" # Platzhalter-Name, Secret muss vor `helm install` vorhanden sein
      annotations: {}
    env: {}

# ---------------------------------------------------------------------------
# Zustandsbehaftete Infrastruktur (P26-S3): postgresql / keycloak / minio (NUR
# diese drei, explizite Nutzervorgabe) bekommen einen enabled/external-
# Umschalter, damit eine Installation wahlweise die im Chart gebündelte
# Instanz nutzt ODER auf eine bereits vorhandene externe Instanz zeigt (z. B.
# verwaltete RDS-Postgres, zentrales Keycloak, externes S3/MinIO). NATS und
# Redis bleiben bewusst bundled-only OHNE diesen Umschalter (explizite
# Nutzerentscheidung, siehe ADR 0099) — für sie unten nur Verbindungsdaten der
# gebündelten Instanz.
#
# Reale Deployment+Service(+PVC)-Manifeste seit dieser Session in
# templates/postgresql.yaml / templates/keycloak.yaml / templates/minio.yaml /
# templates/nats.yaml / templates/redis.yaml — eigene Templates statt des
# generischen services:-Mechanismus oben, weil diese fünf strukturell zu
# verschieden sind (Volumes, andere Image-Quellen/Healthchecks/Ports,
# Secret-Verweise statt reiner Env-Werte). Ressourcennamen sind exakt
# "<fullname>-postgresql" / "<fullname>-keycloak" / "<fullname>-minio" /
# "<fullname>-nats" / "<fullname>-redis" (via dms.serviceFullname, wie beim
# generischen Mechanismus) — damit funktionieren die seit P26-S1 bestehenden
# Helper (dms.postgresDsn/dms.keycloakBaseUrl/dms.natsUrl) sowie die in
# dieser Session neuen (dms.minioEndpoint/dms.redisUrl) unverändert.
#
# Secrets (P26-S3, siehe ADR 0100 "existingSecret-if-set-else-generate"):
# jede Komponente mit einem Passwort bekommt ein `existingSecret`-Feld
# (Standard-Helm-Konvention, siehe z. B. Bitnami-Charts). Leer (Default) =
# templates/secrets.yaml generiert ein Secret aus dem Klartext-
# `*.auth.password`/`*.admin.password`-Wert unten (Key-Namen siehe
# templates/_helpers.tpl `dms.*SecretKey`) — reiner Dev-/Test-Komfort-Default
# (Parität zum bestehenden Compose-Dev-Setup, wie schon seit P26-S1
# dokumentiert), NICHT für Produktion gedacht. Gesetzt = dieses bereits
# vorhandene Secret referenzieren, `*.auth.password` wird dann ignoriert —
# produktiver Pfad: entweder `--set postgresql.existingSecret=...` (+ eigene,
# separate values-Datei mit echten Passwörtern NICHT im Repo) oder ein vorab
# per External-Secrets-Operator/Sealed-Secrets/manuell angelegtes Secret.
# Die Deployments unten konsumieren das Passwort ausschließlich über
# `valueFrom.secretKeyRef`, nie mehr als literalen Env-Wert.
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  # Siehe Secrets-Erklärung oben — leer = generiertes Secret aus
  # auth.password, gesetzt = dieses bereits vorhandene Secret referenzieren
  # (erwartet Key "postgres-password", siehe dms.postgresSecretKey).
  existingSecret: ""
  auth:
    # Dev-Default (Parität infra/docker-compose.yml POSTGRES_USER/_PASSWORD/_DB)
    # - nur wirksam, solange existingSecret leer ist (siehe oben).
    username: dms
    password: dms_dev_only
    database: dms
  persistence:
    size: 5Gi
    # leer = Cluster-Default-StorageClass
    storageClassName: ""
  resources:
    memory:
      requests: 256Mi
      limits: 768Mi
    cpu:
      requests: 250m
      limits: 1000m
  external:
    host: ""
    port: 5432
    database: ""
    username: ""
    # Pflichtfeld, sobald enabled=false — Name eines bereits vorhandenen
    # Secrets mit Key "postgres-password" (siehe dms.postgresSecretName in
    # templates/_helpers.tpl). Kein Klartext-Passwort-Feld hier (ADR 0100).
    existingSecret: ""

keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "25.0"
  existingSecret: ""
  admin:
    # Dev-Default (Parität KEYCLOAK_ADMIN/_PASSWORD) - siehe Secrets-Erklärung
    # oben.
    username: admin
    password: admin_dev_only
  resources:
    memory:
      requests: 512Mi
      limits: 1Gi
    cpu:
      requests: 250m
      limits: 1000m
  # KEIN eigener PersistentVolumeClaim (anders als Postgres/MinIO/NATS unten,
  # bewusste P26-S3-Entscheidung): KC_DB=postgres (siehe
  # infra/docker-compose.yml, Keycloak nutzt dieselbe Postgres-Instanz) - der
  # gesamte fachliche Zustand (Realms/Clients/Users/Sessions) liegt im
  # (bundled oder externen) Postgres, nicht in Keycloak selbst. Das in
  # infra/docker-compose.yml gemountete keycloak-data-Volume
  # (/opt/keycloak/data) enthält bei postgres-basiertem Betrieb nur
  # Provider-/Theme-Erweiterungen und Transaktionslogs, keine fachlichen
  # Daten - unschädlich verlierbar bei einem Pod-Neustart in dieser
  # Single-Replica-v1-Bereitstellung.
  external:
    baseUrl: ""
    realm: "dms"

minio:
  enabled: true
  image:
    repository: minio/minio
    tag: RELEASE.2024-06-13T22-53-53Z
  existingSecret: ""
  auth:
    # Dev-Default (Parität MINIO_ROOT_USER/_PASSWORD) - siehe Secrets-Erklärung
    # oben.
    rootUser: dms_minio
    rootPassword: dms_minio_dev_only
  persistence:
    size: 10Gi
    storageClassName: ""
  resources:
    memory:
      requests: 256Mi
      limits: 512Mi
    cpu:
      requests: 150m
      limits: 500m
  external:
    endpoint: ""
    bucket: ""
    # Pflichtfeld, sobald enabled=false — Name eines bereits vorhandenen
    # Secrets mit Key "root-password" (siehe dms.minioSecretName). Kein
    # Klartext-Passwort-Feld hier (ADR 0100).
    existingSecret: ""

# Bundled-only, kein enabled/external-Umschalter (explizite Nutzerentscheidung,
# siehe ADR 0099). Kein Passwort/Secret nötig — NATS läuft hier ohne Auth,
# analog infra/docker-compose.yml.
nats:
  image:
    repository: nats
    tag: 2.10-alpine
  port: 4222
  monitorPort: 8222
  persistence:
    # JetStream (-js -sd /data, siehe infra/docker-compose.yml) persistiert
    # Streams/Consumer-State auf Platte - anders als Redis unten ist ein
    # Neustart-Datenverlust hier fachlich relevant (Event-Bus, Konzept 3.4),
    # deshalb PVC.
    size: 5Gi
    storageClassName: ""
  resources:
    memory:
      requests: 128Mi
      limits: 384Mi
    cpu:
      requests: 100m
      limits: 500m

# Bundled-only, kein enabled/external-Umschalter (explizite Nutzerentscheidung,
# siehe ADR 0099). Kein Passwort/Secret nötig — Redis läuft hier ohne Auth,
# analog infra/docker-compose.yml.
redis:
  image:
    repository: redis
    tag: 7-alpine
  port: 6379
  # KEIN PersistentVolumeClaim (anders als Postgres/MinIO/NATS oben): dient
  # ausschließlich als Rate-Limit-Store für gateway-service (ADR 0097,
  # Sorted-Set-Sliding-Window mit TTL je Client-Key) - rein transiente Daten,
  # `--save ""`/kein AOF bereits in infra/docker-compose.yml bewusst
  # abgeschaltet (siehe dortiger Kommentar/ADR 0097 "Kein
  # Redis-Persistenz-Volume"). Ein Neustart setzt das Limit unschädlich
  # zurück - kein fachlicher Grund für Festplatten-I/O, gleiche Begründung
  # hier 1:1 übernommen.
  resources:
    memory:
      requests: 64Mi
      limits: 128Mi
    cpu:
      requests: 50m
      limits: 200m

# ---------------------------------------------------------------------------
# storageService.targets — natives YAML-Äquivalent zu STORAGE_SERVICE_TARGETS
# (siehe services/storage-service/src/storage_service/settings.py,
# BackendTargetConfig) statt eines einzelnen JSON-Freitext-Strings. Feldnamen
# sind 1:1 aus BackendTargetConfig übernommen. Wird vom generischen
# Deployment-Template (nur für Services mit `storageTargetsEnv: true`, siehe
# storage-service oben) zur Laufzeit per `toJson` in die vom Service
# tatsächlich gelesene Umgebungsvariable serialisiert.
#
# WICHTIG (Abweichung vom Session-Briefing): die vom Service gelesene
# Variable heißt `DMS_TARGETS`, NICHT `STORAGE_SERVICE_TARGETS` —
# `STORAGE_SERVICE_TARGETS` ist nur der Name der HOST-seitigen
# Compose-.env-Variable, die den Wert von DMS_TARGETS befüllt (siehe
# `DMS_TARGETS: ${STORAGE_SERVICE_TARGETS:-...}` in infra/docker-compose.yml).
# `Settings` nutzt env_prefix "DMS_" + Feldname `targets` -> `DMS_TARGETS` ist
# der einzige Name, den storage-service im Container tatsächlich liest.
#
# endpoint_url des secondary-s3-Ziels (P26-S3): "__DMS_MINIO_ENDPOINT__" ist
# ein Platzhalter, den dms.storageServiceTargetsEnv (templates/_helpers.tpl)
# beim Rendern per Text-Replace durch dms.minioEndpoint ersetzt (respektiert
# minio.enabled bundled/external) — VORHER (P26-S1/S2) stand hier der reine
# Compose-Hostname "http://minio:9000" fest eingebrannt, der in diesem Chart
# gar nicht existiert(e); erst der reale templates/minio.yaml-Service dieser
# Session hat den Bug sichtbar gemacht. access_key/secret_key bleiben
# bewusst weiterhin Klartext-Dev-Defaults (deckungsgleich mit
# minio.auth.rootUser/-rootPassword oben) — eine Secret-Anbindung dieser
# storage-service-spezifischen Ziel-Liste ist ein offener Punkt für eine
# spätere Session (siehe P26-S3-Session-Report), diese Session hat nur den
# Postgres-/Keycloak-/MinIO-Admin-Secret-Pfad selbst gebaut (siehe ADR 0100),
# nicht jeden nachgelagerten Konsumenten von MinIO-Zugangsdaten.
# ---------------------------------------------------------------------------
storageService:
  targets:
    - id: primary-local
      type: local
      base_path: /data/storage
    - id: secondary-s3
      type: s3
      endpoint_url: "__DMS_MINIO_ENDPOINT__"
      access_key: dms_minio
      secret_key: dms_minio_dev_only
      bucket: dms-storage
      region: us-east-1
  writeStrategy: primary_async
  quorumCount: 1

# ---------------------------------------------------------------------------
# storageCronJob (P26-S4) — externer periodischer Auslöser für den
# storage-service-Endpunkt, den der Service laut ADR 0004 bewusst NICHT
# selbst per In-Prozess-Hintergrundtask ausführt (siehe PROGRESS.md P20-S6:
# "storage-service als k8s CronJob statt extern zu triggern", explizit auf
# diese Session verschoben). Siehe ADR 0101 für die vollständige
# Begründung/Herleitung dieses gesamten Blocks.
#
# WICHTIG — Abweichung vom Session-Briefing: es gibt hier bewusst nur EINEN
# funktionsfähigen CronJob (Replikation), nicht zwei. Der zweite im Briefing
# angenommene Endpunkt (`GET /object-verify/{key:path}/all`,
# services/storage-service/src/storage_service/main.py Zeile 523) verifiziert
# laut echtem Code (und docs/services/storage-service.md) alle konfigurierten
# ZIELE **eines einzelnen, per Pfad-Parameter übergebenen** Objekt-`key` —
# NICHT "alle Objekte im Store". storage-service hat aktuell keinen Endpunkt,
# der Objektschlüssel auflistet oder eine Charge noch nicht verifizierter
# Objekte liefert (kein Fixity-Pendant zu `list_pending_copies`/
# `POST /replication/process-pending`) — ein blind von außen aufgerufener
# periodischer "verifiziere alles"-CronJob lässt sich damit gegen die
# TATSÄCHLICHE API nicht bauen, ohne einen neuen storage-service-Endpunkt zu
# erfinden (out of scope für eine reine Helm-Chart-Session). `verification`
# unten bleibt deshalb ein bewusst UNVERDRAHTETER Platzhalter (kein Template
# liest ihn) für eine künftige storage-service-Session, die einen echten
# Bulk-Verify-Endpunkt baut (siehe ADR 0101 "Konsequenzen" für einen
# Gestaltungsvorschlag, analog zur Full-Jitter-Backoff-Retry-Queue aus
# ADR 0082).
# ---------------------------------------------------------------------------
storageCronJob:
  enabled: true
  image:
    # Leichtgewichtiges Utility-Image für zwei HTTP-Aufrufe statt des vollen
    # storage-service-Images (siehe ADR 0101) — keine bestehende Projekt-
    # Konvention für ein solches Utility-Image gefunden (infra/docker-
    # compose.yml nutzt curl/wget nur innerhalb der Service-Images selbst für
    # Healthchecks, kein eigener Utility-Container), daher das gängige,
    # offizielle minimale curl-Image gewählt.
    repository: curlimages/curl
    tag: "8.10.1"
  # Utility-Container braucht deutlich weniger als resources.baseline (dafür
  # gedacht für einen echten FastAPI-Prozess) — eigener, kleinerer Block statt
  # Baseline-Fallback.
  resources:
    memory:
      requests: 32Mi
      limits: 64Mi
    cpu:
      requests: 25m
      limits: 100m
  # Service-zu-Service-Prinzip-Header, gleiches Muster wie archival-services
  # `_SYSTEM_PRINCIPAL_HEADERS`/workflow-services X-DMS-Principal-Prüfung
  # (services/archival-service/src/archival_service/clients.py,
  # services/workflow-service/src/workflow_service/main.py) — storage-service
  # verlangt ihn AKTUELL NICHT für `/replication/process-pending` (main.py
  # Zeile 561-564 hat weder `Header(...)` noch `Depends(...)` für Auth, anders
  # als z. B. `DELETE /objects/{key}`s optionaler X-DMS-Roles-Governance-
  # Bypass) — wird trotzdem mitgesendet (kostet nichts, konsistent mit dem
  # projektweiten Muster, zukunftssicher falls storage-service diesen
  # Endpunkt später gated, siehe ADR 0101).
  principalHeader: "system:storage-replication-cronjob"
  replication:
    # Alle 15 Minuten — die Retry-Queue selbst hat seit ADR 0082 bereits
    # Full-Jitter-Backoff (next_retry_at), ein CronJob-Intervall muss also
    # nicht besonders eng sein, um Thundering-Herd-Effekte zu vermeiden; 15
    # Minuten hält "pending"-Kopien trotzdem in überschaubarer Zeit aktuell.
    schedule: "*/15 * * * *"
    # Siehe POST /replication/process-pending?limit=100 (main.py Zeile 563) -
    # identisch zum Endpunkt-eigenen Default, hier explizit statt implizit,
    # damit values.yaml der alleinige Konfigurationsort bleibt.
    limit: 100
    # Deutlich über dem erwarteten Laufzeitbedarf (ein Retry-Batch aus
    # höchstens `limit` Kopien), verhindert aber einen unbegrenzt hängenden
    # Job bei einem tot geglaubten Ziel-Backend.
    activeDeadlineSeconds: 180
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
  verification:
    # Siehe Erklärung im Blockkommentar oben — bewusst kein Template dahinter,
    # reiner dokumentierter Platzhalter für eine spätere Session.
    enabled: false
