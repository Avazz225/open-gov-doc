      className: ""
      host: "office-addin.dms.local"
      path: /
      pathType: Prefix
      tls:
        enabled: true # see the comment above — HTTPS requirement for Office add-ins
        secretName: "office-addin-tls" # placeholder name, the secret must exist before `helm install`
      annotations: {}
    env: {}

# ---------------------------------------------------------------------------
# Stateful infrastructure (P26-S3): postgresql / keycloak / minio (ONLY
# these three, an explicit user requirement) get an enabled/external
# toggle, so that an installation can either use the instance bundled with the
# chart OR point to an already-existing external instance (e.g.
# managed RDS Postgres, a central Keycloak, external S3/MinIO). NATS and
# Redis deliberately stay bundled-only WITHOUT this toggle (an explicit
# user decision, see ADR 0099) — below, only connection data for the
# bundled instance for those.
#
# Real Deployment+Service(+PVC) manifests since this session in
# templates/postgresql.yaml / templates/keycloak.yaml / templates/minio.yaml /
# templates/nats.yaml / templates/redis.yaml — dedicated templates instead of the
# generic services: mechanism above, because these five are structurally too
# different (volumes, different image sources/healthchecks/ports,
# secret references instead of plain env values). Resource names are exactly
# "<fullname>-postgresql" / "<fullname>-keycloak" / "<fullname>-minio" /
# "<fullname>-nats" / "<fullname>-redis" (via dms.serviceFullname, like the
# generic mechanism) — so the helpers that have existed since P26-S1
# (dms.postgresDsn/dms.keycloakBaseUrl/dms.natsUrl) as well as the ones new in
# this session (dms.minioEndpoint/dms.redisUrl) work unchanged.
#
# Secrets (P26-S3, see ADR 0100 "existingSecret-if-set-else-generate"):
# every component with a password gets an `existingSecret` field
# (a standard Helm convention, see e.g. Bitnami charts). Empty (default) =
# templates/secrets.yaml generates a secret from the plaintext
# `*.auth.password`/`*.admin.password` value below (for key names see
# templates/_helpers.tpl `dms.*SecretKey`) — a pure dev/test convenience default
# (parity with the existing Compose dev setup, as already
# documented since P26-S1), NOT intended for production. Set = reference this
# already-existing secret, `*.auth.password` is then ignored —
# the production path: either `--set postgresql.existingSecret=...` (+ your own,
# separate values file with real passwords NOT in the repo) or a secret
# created beforehand via External Secrets Operator/Sealed Secrets/manually.
# The deployments below consume the password exclusively via
# `valueFrom.secretKeyRef`, never as a literal env value.
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  # See the secrets explanation above — empty = a generated secret from
  # auth.password, set = reference this already-existing secret
  # (expects key "postgres-password", see dms.postgresSecretKey).
  existingSecret: ""
  auth:
    # Dev default (parity with infra/docker-compose.yml POSTGRES_USER/_PASSWORD/_DB)
    # - only effective as long as existingSecret is empty (see above).
    username: dms
    password: dms_dev_only
    database: dms
  persistence:
    size: 5Gi
    # empty = the cluster's default StorageClass
    storageClassName: ""
  resources:
    memory:
      requests: 256Mi
      limits: 768Mi
    cpu:
      requests: 250m
      limits: 1000m
  external:
    host: ""
    port: 5432
    database: ""
    username: ""
    # Required field once enabled=false — name of an already-existing
    # secret with key "postgres-password" (see dms.postgresSecretName in
    # templates/_helpers.tpl). No plaintext password field here (ADR 0100).
    existingSecret: ""

keycloak:
  enabled: true
  image:
    repository: quay.io/keycloak/keycloak
    tag: "25.0"
  existingSecret: ""
  admin:
    # Dev default (parity with KEYCLOAK_ADMIN/_PASSWORD) - see the secrets
    # explanation above.
    username: admin
    password: admin_dev_only
  resources:
    memory:
      requests: 512Mi
      limits: 1Gi
    cpu:
      requests: 250m
      limits: 1000m
  # NO own PersistentVolumeClaim (unlike Postgres/MinIO/NATS below,
  # a deliberate P26-S3 decision): KC_DB=postgres (see
  # infra/docker-compose.yml, Keycloak uses the same Postgres instance) - the
  # entire business state (realms/clients/users/sessions) lives in the
  # (bundled or external) Postgres, not in Keycloak itself. The
  # keycloak-data volume mounted in infra/docker-compose.yml
  # (/opt/keycloak/data) contains, under Postgres-based operation, only
  # provider/theme extensions and transaction logs, no business
  # data - harmlessly losable on a pod restart in this
  # single-replica v1 deployment.
  external:
    baseUrl: ""
    realm: "dms"

minio:
  enabled: true
  image:
    repository: minio/minio
    tag: RELEASE.2024-06-13T22-53-53Z
  existingSecret: ""
  auth:
    # Dev default (parity with MINIO_ROOT_USER/_PASSWORD) - see the secrets
    # explanation above.
    rootUser: dms_minio
    rootPassword: dms_minio_dev_only
  persistence:
    size: 10Gi
    storageClassName: ""
  resources:
    memory:
      requests: 256Mi
      limits: 512Mi
    cpu:
      requests: 150m
      limits: 500m
  external:
    endpoint: ""
    bucket: ""
    # Required field once enabled=false — name of an already-existing
    # secret with key "root-password" (see dms.minioSecretName). No
    # plaintext password field here (ADR 0100).
    existingSecret: ""

# Bundled-only, no enabled/external toggle (an explicit user decision,
# see ADR 0099). No password/secret needed — NATS runs here without auth,
# analogous to infra/docker-compose.yml.
nats:
  image:
    repository: nats
    tag: 2.10-alpine
  port: 4222
  monitorPort: 8222
  persistence:
    # JetStream (-js -sd /data, see infra/docker-compose.yml) persists
    # streams/consumer state to disk - unlike Redis below, data loss on
    # restart is functionally relevant here (event bus, concept 3.4),
    # hence a PVC.
    size: 5Gi
    storageClassName: ""
  resources:
    memory:
      requests: 128Mi
      limits: 384Mi
    cpu:
      requests: 100m
      limits: 500m

# Bundled-only, no enabled/external toggle (an explicit user decision,
# see ADR 0099). No password/secret needed — Redis runs here without auth,
# analogous to infra/docker-compose.yml.
redis:
  image:
    repository: redis
    tag: 7-alpine
  port: 6379
  # NO PersistentVolumeClaim (unlike Postgres/MinIO/NATS above): serves
  # exclusively as the rate-limit store for gateway-service (ADR 0097,
  # a sorted-set sliding window with TTL per client key) - purely transient data,
  # `--save ""`/no AOF is already deliberately disabled in
  # infra/docker-compose.yml (see the comment there/ADR 0097 "No
  # Redis persistence volume"). A restart harmlessly resets the limit
  # - no functional reason for disk I/O, the same rationale
  # carried over 1:1 here.
  resources:
    memory:
      requests: 64Mi
      limits: 128Mi
    cpu:
      requests: 50m
      limits: 200m

# ---------------------------------------------------------------------------
# storageService.targets — a native YAML equivalent of STORAGE_SERVICE_TARGETS
# (see services/storage-service/src/storage_service/settings.py,
# BackendTargetConfig) instead of a single JSON free-text string. Field names
# are taken 1:1 from BackendTargetConfig. Serialized by the generic
# deployment template (only for services with `storageTargetsEnv: true`, see
# storage-service above) at render time via `toJson` into the environment
# variable actually read by the service.
#
# IMPORTANT (a deviation from the session briefing): the variable read by
# the service is called `DMS_TARGETS`, NOT `STORAGE_SERVICE_TARGETS` —
# `STORAGE_SERVICE_TARGETS` is only the name of the HOST-side
# Compose .env variable that populates the value of DMS_TARGETS (see
# `DMS_TARGETS: ${STORAGE_SERVICE_TARGETS:-...}` in infra/docker-compose.yml).
# `Settings` uses env_prefix "DMS_" + field name `targets` -> `DMS_TARGETS` is
# the only name storage-service actually reads inside the container.
#
# endpoint_url of the secondary-s3 target (P26-S3): "__DMS_MINIO_ENDPOINT__" is
# a placeholder that dms.storageServiceTargetsEnv (templates/_helpers.tpl)
# replaces via text substitution with dms.minioEndpoint at render time (respects
# minio.enabled bundled/external) — BEFORE (P26-S1/S2), this held the plain
# Compose hostname "http://minio:9000" hardcoded, which didn't
# even exist in this chart; only the real templates/minio.yaml service from this
# session made the bug visible. access_key/secret_key deliberately remain
# plaintext dev defaults for now (matching
# minio.auth.rootUser/-rootPassword above) — connecting this
# storage-service-specific target list to a secret is an open point for a
# later session (see the P26-S3 session report); this session only built the
# Postgres/Keycloak/MinIO admin secret path itself (see ADR 0100),
# not every downstream consumer of MinIO credentials.
# ---------------------------------------------------------------------------
storageService:
  targets:
    - id: primary-local
      type: local
      base_path: /data/storage
    - id: secondary-s3
      type: s3
      endpoint_url: "__DMS_MINIO_ENDPOINT__"
      access_key: dms_minio
      secret_key: dms_minio_dev_only
      bucket: dms-storage
      region: us-east-1
  writeStrategy: primary_async
  quorumCount: 1

# ---------------------------------------------------------------------------
# storageCronJob (P26-S4) — an external periodic trigger for the
# storage-service endpoint that the service, per ADR 0004, deliberately does NOT
# run itself via an in-process background task (see PROGRESS.md P20-S6:
# "storage-service as a k8s CronJob instead of triggering externally", explicitly
# deferred to this session). See ADR 0101 for the full
# rationale/derivation of this entire block.
#
# IMPORTANT — a deviation from the session briefing: there is deliberately only ONE
# functional CronJob here (replication), not two. The second endpoint
# assumed in the briefing (`GET /object-verify/{key:path}/all`,
# services/storage-service/src/storage_service/main.py line 523) verifies,
# according to the real code (and docs/services/storage-service.md), all configured
# TARGETS **of a single object `key` passed as a path parameter** —
# NOT "all objects in the store". storage-service currently has no endpoint
# that lists object keys or delivers a batch of not-yet-verified
# objects (no fixity counterpart to `list_pending_copies`/
# `POST /replication/process-pending`) — a periodic "verify everything"
# CronJob called blindly from outside therefore can't be built against the
# ACTUAL API without inventing a new storage-service endpoint
# (out of scope for a pure Helm chart session). `verification`
# below therefore deliberately remains an UNWIRED placeholder (no template
# reads it) for a future storage-service session that builds a real
# bulk-verify endpoint (see ADR 0101 "Consequences" for a
# design proposal, analogous to the full-jitter backoff retry queue from
# ADR 0082).
# ---------------------------------------------------------------------------
storageCronJob:
  enabled: true
  image:
    # A lightweight utility image for two HTTP calls instead of the full
    # storage-service image (see ADR 0101) — no existing project
    # convention found for such a utility image (infra/docker-
    # compose.yml uses curl/wget only within the service images themselves for
    # healthchecks, no dedicated utility container), hence the common,
    # official minimal curl image was chosen.
    repository: curlimages/curl
    tag: "8.10.1"
  # A utility container needs significantly less than resources.baseline (that's
  # meant for a real FastAPI process) — its own, smaller block instead of
  # a baseline fallback.
  resources:
    memory:
      requests: 32Mi
      limits: 64Mi
    cpu:
      requests: 25m
      limits: 100m
  # Service-to-service principal header, the same pattern as archival-service's
  # `_SYSTEM_PRINCIPAL_HEADERS`/workflow-service's X-DMS-Principal check
  # (services/archival-service/src/archival_service/clients.py,
  # services/workflow-service/src/workflow_service/main.py) — storage-service
  # does NOT CURRENTLY require it for `/replication/process-pending` (main.py
  # lines 561-564 have neither `Header(...)` nor `Depends(...)` for auth, unlike
  # e.g. `DELETE /objects/{key}`'s optional X-DMS-Roles governance
  # bypass) — sent along anyway (costs nothing, consistent with the
  # project-wide pattern, future-proof in case storage-service gates this
  # endpoint later, see ADR 0101).
  principalHeader: "system:storage-replication-cronjob"
  replication:
    # Every 15 minutes — the retry queue itself has had
    # full-jitter backoff since ADR 0082 (next_retry_at), so a CronJob interval doesn't
    # need to be especially tight to avoid thundering-herd effects; 15
    # minutes still keeps "pending" copies current within a reasonable time.
    schedule: "*/15 * * * *"
    # See POST /replication/process-pending?limit=100 (main.py line 563) -
    # identical to the endpoint's own default, made explicit here instead of implicit
    # so that values.yaml remains the single place of configuration.
    limit: 100
    # Well above the expected runtime requirement (a retry batch of at
    # most `limit` copies), but prevents an indefinitely hanging
    # job if a target backend is presumed dead.
    activeDeadlineSeconds: 180
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
  verification:
    # See the explanation in the block comment above — deliberately no template behind it,
    # a purely documented placeholder for a later session.
    enabled: false
