# values.yaml — DMS Helm-Chart (Phase 26, P26-S1 + P26-S2)
#
# EIN Chart für alle Container aus infra/docker-compose.yml. Statt eines
# Templates pro Service (34+ fast identische Kopien) iterieren die
# generischen Templates unter templates/ über die `services:`-Map unten
# (siehe ADR — Dateiname siehe docs/adr/, "one chart, values-driven service
# map"). Neue Services werden hinzugefügt, indem hier ein neuer Eintrag unter
# `services:` erscheint — nie durch ein neues Template.
#
# P26-S1 baute das Grundgerüst + 4 reale Beispiel-Einträge (registry-service,
# gateway-service, document-service, storage-service) zum Beweis, dass die
# Templates echt rendern. P26-S2 (diese Session) ergänzt die übrigen ~28
# zustandslosen FastAPI-Services aus infra/docker-compose.yml nach demselben
# Muster — kein neues Template, nur weitere `services.<name>:`-Blöcke.
# Ausgenommen bleiben (siehe IMPLEMENTATION_PLAN.md P26-S3/S4/S5):
# postgres/keycloak/nats/minio/azurite/mailpit/redis/prometheus/grafana
# (zustandsbehaftete Infrastruktur, P26-S3), postgres-wal-archive-init (Job,
# kein Deployment — siehe offener Punkt im P26-S2-Report), das
# Storage-Replikations-CronJob-Äquivalent (P26-S4) sowie die Next.js-Frontend-
# Apps user-ui/admin-ui/process-designer/reviewer-ui/migration-console/
# office-addin (P26-S5).

global:
  # Installationsweite Identität (Konzept 3a) — entspricht DMS_INSTALLATION_ID
  # / DMS_INSTALLATION_DISPLAY_NAME in infra/docker-compose.yml, hier als
  # Helm-Values statt Compose-.env.
  installationId: local-dev
  installationDisplayName: "DMS-Installation (Kubernetes)"
  image:
    # Optionales Registry-Prefix, z. B. "registry.example.com/" (mit
    # trailing slash) — leer = services.<name>.image.repository wird
    # unverändert verwendet. Getrennt von den einzelnen Repository-Pfaden
    # gehalten, damit ein Registry-Wechsel nicht 34 Einträge anfasst.
    registry: ""
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# resources.baseline — Default-Requests/-Limits (harte Nutzeranforderung).
# Jeder services.<name> ohne eigenen `resources:`-Block fällt hierauf zurück;
# ein Service, der `resources:` (auch nur teilweise) angibt, überschreibt nur
# die angegebenen Felder (Deep-Merge via `mergeOverwrite` in
# templates/_helpers.tpl, siehe dort `dms.mergedResources`).
# ---------------------------------------------------------------------------
resources:
  baseline:
    memory:
      requests: 128Mi
      limits: 256Mi
    cpu:
      requests: 100m
      limits: 500m

# ---------------------------------------------------------------------------
# services — eine Map, ein Eintrag je Container. Shape ist für ALLE Services
# identisch (auch die, die P26-S2 noch ergänzt) — das ist der ganze Punkt
# dieser Architektur.
#
# Erwartete Felder je Eintrag:
#   enabled                    - bool, false = Deployment/Service werden nicht gerendert
#   image.repository / .tag    - Container-Image
#   port                       - Container-Port (siehe infra/docker-compose.yml,
#                                 bei den FastAPI-Services intern immer 8000)
#   replicas                   - Start-Replicas (bei autoscaling.enabled i.d.R. == minReplicas)
#   resources                  - optional, selektiver Override von resources.baseline
#                                 (Shape: {memory: {requests, limits}, cpu: {requests, limits}})
#   autoscaling                - HPA-Konfiguration, siehe templates/hpa.yaml
#   podDisruptionBudget        - PDB-Konfiguration, siehe templates/pdb.yaml
#   dependsOnServices          - optional, Liste anderer services.<name>-Keys; für jeden
#                                 Eintrag wird automatisch ein
#                                 DMS_<NAME>_BASE_URL=http://<fullname>-<name>:8000 Env-Var
#                                 gesetzt (Pendant zu den Compose DMS_*_SERVICE_BASE_URL-
#                                 Zeilen) — spart es, jede Upstream-URL einzeln in `env:`
#                                 zu tippen.
#   usesKeycloak                - optional bool, injiziert DMS_KEYCLOAK_BASE_URL (siehe
#                                 dms.keycloakBaseUrl-Helper, respektiert keycloak.enabled/
#                                 external unten)
#   storageTargetsEnv          - optional bool, NUR für storage-service: injiziert
#                                 DMS_TARGETS/DMS_WRITE_STRATEGY/DMS_QUORUM_COUNT aus dem
#                                 storageService:-Block unten (siehe dort)
#   env                        - Map zusätzlicher/überschreibender Env-Vars (roher Wert,
#                                 kein Templating — für Werte, die keine berechnete
#                                 Service-URL sind)
# ---------------------------------------------------------------------------
services:
  # --- Beispiel 1: einfacher Service, reiner resources.baseline-Fallback ---
  registry-service:
    enabled: true
    image:
      repository: dms/registry-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~276 (Container-Port, Host-Mapping ist 8001)
    replicas: 1
    # kein eigener resources-Block -> komplett resources.baseline (Verifikationsfall
    # "ein Service nutzt reinen Baseline-Fallback", siehe PROGRESS/Report)
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    env: {}

  # --- Beispiel 2: "public route"-Charakter (vom Gateway nach außen erreichbar),
  # mehrere Replicas -> PDB sinnvoll und hier aktiv geschaltet, um
  # templates/pdb.yaml in dieser Session tatsächlich zu rendern. ---
  gateway-service:
    enabled: true
    image:
      repository: dms/gateway-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~1437 (Host-Mapping 8009)
    replicas: 2
    resources:
      # selektiver Override: nur cpu, memory bleibt beim resources.baseline-Fallback
      # (Verifikationsfall "ein Service überschreibt selektiv")
      cpu:
        requests: 200m
        limits: 750m
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true # aktiv in dieser Session, um templates/pdb.yaml zu exercisen
      minAvailable: 1
    usesKeycloak: true
    env:
      DMS_KEYCLOAK_CLIENT_ID: "dms-api"
      # Reale OCP-Route (Ingress-Äquivalent) für den öffentlichen Zugriff auf
      # gateway-service folgt in P26-S2/S5 zusammen mit den Frontend-Apps
      # (braucht deren finale Hostnamen) — hier bewusst noch nicht gebaut.
      DMS_CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'

  # --- Beispiel 3: mehrere Upstream-Abhängigkeiten (dependsOnServices),
  # Autoscaling aktiv -> exercised templates/hpa.yaml in dieser Session, plus
  # PDB aktiv (zweiter Beleg neben gateway-service). ---
  document-service:
    enabled: true
    image:
      repository: dms/document-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~481 (Host-Mapping 8006)
    replicas: 2
    resources:
      # vollständiger Override beider Achsen (dritter Verifikationsfall)
      memory:
        requests: 256Mi
        limits: 512Mi
      cpu:
        requests: 150m
        limits: 600m
    autoscaling:
      enabled: true # aktiv in dieser Session, um templates/hpa.yaml zu exercisen
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 80
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    dependsOnServices:
      - storage-service
      - folder-service
      - object-type-service
    env: {}

  # --- Beispiel 4: storage-service — belegt storageService.targets (unten)
  # via DMS_TARGETS/DMS_WRITE_STRATEGY/DMS_QUORUM_COUNT, siehe
  # storageTargetsEnv-Flag und dms.storageServiceTargetsEnv in _helpers.tpl.
  # Zweiter reiner Baseline-Fallback-Fall (kein eigener resources-Block). ---
  storage-service:
    enabled: true
    image:
      repository: dms/storage-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~433 (Host-Mapping 8005)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    storageTargetsEnv: true
    env:
      DMS_GOVERNANCE_BYPASS_ROLE: "dms-admin"

  # ---------------------------------------------------------------------
  # Ab hier: die ~28 Services aus P26-S2 (zustandslose FastAPI-Services,
  # infra/docker-compose.yml Zeilen ~287-1409), in derselben Reihenfolge wie
  # dort. Env-Var-Namen/Cross-Service-Abhängigkeiten sind 1:1 aus den
  # jeweiligen `environment:`-Blöcken in infra/docker-compose.yml plus den
  # zugehörigen services/<name>/src/*/settings.py-Defaults übernommen (nicht
  # geraten) — wo ein settings.py-Default bereits mit dem
  # infra/docker-compose.yml-Wert übereinstimmt, wird die Zeile hier bewusst
  # NICHT dupliziert (schlankes values.yaml, gleiche Praxis wie
  # registry-service oben). Autoscaling ist nur für die 4 Services aktiv, die
  # den P26-S2-Session-Report als "busy/horizontal skalierbar" begründet
  # (virus-scan-, rendering-, ocr-, search-service) — alle anderen bleiben
  # beim P26-S1-Baseline-Muster (1 Replica, autoscaling/PDB aus).
  # ---------------------------------------------------------------------

  # Audit-Log/Löschregister-Ledger (Konzept 5.2a/10.4) - reiner Consumer +
  # eigenes Postgres-Schema, keine Cross-Service-BASE_URL-Abhängigkeiten
  # jenseits von dms.baseEnv (Registry/Self-Address/Postgres/NATS).
  # OFFENER PUNKT: infra/docker-compose.yml mountet für diesen Service ein
  # eigenes deletion-ledger-data-Volume (Löschregister-Ledger) - das
  # generische deployment.yaml-Template unterstützt aktuell keine
  # volumeMounts/PVCs (bewusst nicht in dieser Session nachgerüstet, siehe
  # Session-Report) - ohne PVC verliert audit-service dieses Ledger bei
  # jedem Pod-Neustart. Nachzuholen in P26-S3 zusammen mit den übrigen
  # PVC-gestützten Komponenten.
  audit-service:
    enabled: true
    image:
      repository: dms/audit-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~287 (Host-Mapping 8002)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    env: {}

  # SSO/Keycloak-Frontend + föderierte Kontaktsuche (Konzept 2.5/4.4/7.4).
  # usesKeycloak für DMS_KEYCLOAK_BASE_URL; keycloak_client_secret/
  # keycloak_admin_username/keycloak_admin_password-Defaults in settings.py
  # decken sich bereits mit infra/docker-compose.yml (dms-api-dev-secret/
  # admin/admin_dev_only) - hier bewusst nicht dupliziert.
  # dependsOnServices nutzt für federation-hub-service/gateway-service die
  # seit dieser Session (P26-S2) erweiterte dict-Form (siehe _helpers.tpl),
  # weil deren infra/docker-compose.yml-Env-Var-Namen
  # (DMS_FEDERATION_HUB_BASE_URL/DMS_INSTALLATION_GATEWAY_BASE_URL) vom
  # Standardmuster DMS_<KEY>_BASE_URL abweichen.
  auth-service:
    enabled: true
    image:
      repository: dms/auth-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~317 (Host-Mapping 8003)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    usesKeycloak: true
    dependsOnServices:
      - permission-service
      - name: federation-hub-service
        envVar: DMS_FEDERATION_HUB_BASE_URL
      - name: gateway-service
        envVar: DMS_INSTALLATION_GATEWAY_BASE_URL
    env:
      # settings.py-Default für keycloak_public_base_url ist None (SSO-
      # Browser-Redirect-Flow aus) - infra/docker-compose.yml aktiviert ihn
      # dev-typisch mit der extern gemappten Keycloak-Adresse. In diesem
      # Chart existiert noch keine reale OCP-Route für Keycloak (P26-S3 baut
      # das echte Keycloak-Deployment) - Platzhalter, gleiches offene
      # Problem wie bei gateway-service (CORS/Route, siehe dessen Kommentar
      # oben).
      DMS_KEYCLOAK_PUBLIC_BASE_URL: "http://localhost:8080"
      # settings.py-Default ist False (föderierte Kontaktsuche ist laut
      # Konzept 2.5 wörtlich opt-in) - infra/docker-compose.yml schaltet sie
      # dev-typisch für den Selbst-Loopback-Smoke-Test scharf, hier zur
      # Parität ebenso.
      DMS_FEDERATED_DIRECTORY_ENABLED: "true"

  permission-service:
    enabled: true
    image:
      repository: dms/permission-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~364 (Host-Mapping 8004)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - auth-service
    env: {}

  # Teil der Upload-Hotpath-Pipeline (document-service ruft synchron auf) -
  # skaliert deshalb horizontal mit (eine der P26-S2-Autoscaling-Auswahlen,
  # siehe Session-Report). scan_engine-Default in settings.py ist bereits
  # "eicar" (deckungsgleich mit infra/docker-compose.yml) - keine explizite
  # env-Zeile nötig.
  virus-scan-service:
    enabled: true
    image:
      repository: dms/virus-scan-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~500 (Host-Mapping 8010)
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    dependsOnServices:
      - storage-service
      - document-service
      - permission-service
    env: {}

  # LibreOffice-headless-Konvertierung (docs/services/rendering-service.md)
  # ist CPU-/Speicher-lastiger als der Standard-FastAPI-Service (soffice
  # läuft als eigener Subprozess je Konvertierung) - resources-Override statt
  # reinem Baseline-Fallback. Horizontal skalierbar (keine lokale
  # Zustandshaltung, jede Konvertierung bekommt ein isoliertes
  # UserInstallation-Profil, siehe docs) - eine der P26-S2-Autoscaling-
  # Auswahlen.
  rendering-service:
    enabled: true
    image:
      repository: dms/rendering-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~537 (Host-Mapping 8011)
    replicas: 2
    resources:
      memory:
        requests: 512Mi
        limits: 1Gi
      cpu:
        requests: 300m
        limits: 1000m
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    dependsOnServices:
      - storage-service
      - document-service
      - ocr-service
      - permission-service
    env: {}

  # Tesseract-OCR (docs/services/ocr-service.md) ist CPU-lastig je
  # Seite/Bild - resources-Override. Optionaler Dienst (Compose-Profil
  # "ocr", laut .env.example standardmäßig aktiv) - hier wie jeder andere
  # Service einfach über `enabled` gesteuert, kein eigenes Profil-Äquivalent
  # in diesem Chart nötig. Horizontal skalierbar (jede Extraktion ist
  # unabhängig), aber ohne HA-Anspruch im Leerlauf -> minReplicas 1 statt 2
  # und PDB aus (ein Single-Replica-PDB mit minAvailable:1 würde
  # Node-Drains blockieren, gleiches Prinzip wie registry-service/
  # storage-service oben).
  ocr-service:
    enabled: true
    image:
      repository: dms/ocr-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~578 (Host-Mapping 8012)
    replicas: 1
    resources:
      memory:
        requests: 384Mi
        limits: 768Mi
      cpu:
        requests: 300m
        limits: 1200m
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - storage-service
      - document-service
      - permission-service
    env: {}

  # Postgres-FTS/Trigram-Suche (docs/services/search-service.md) - die
  # eigentliche Rechenlast liegt serverseitig im (gebündelten) Postgres,
  # nicht in diesem Service selbst; trotzdem ein moderater Memory-Override
  # für Connection-Pooling/Query-Aufbau bei paralleler Last. Klassischer
  # horizontal skalierbarer Lesepfad (zustandslos, kein lokaler Cache lt.
  # Konzept 2.4) - eine der P26-S2-Autoscaling-Auswahlen.
  search-service:
    enabled: true
    image:
      repository: dms/search-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~610 (Host-Mapping 8013)
    replicas: 2
    resources:
      memory:
        requests: 192Mi
        limits: 384Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    dependsOnServices:
      - document-service
      - folder-service
      - object-type-service
      - permission-service
      - ocr-service
      - rendering-service
    env: {}

  # sla_poll_interval_seconds/federation_process_type_map-Defaults in
  # settings.py decken sich bereits mit infra/docker-compose.yml (30 / "{}")
  # - keine expliziten env-Zeilen nötig. dependsOnServices nutzt für
  # federation-hub-service/gateway-service dieselbe dict-Form wie
  # auth-service oben, gleicher Grund (Compose-Env-Var-Name weicht vom
  # DMS_<KEY>_BASE_URL-Muster ab).
  workflow-service:
    enabled: true
    image:
      repository: dms/workflow-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~648 (Host-Mapping 8014)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - permission-service
      - signature-service
      - name: federation-hub-service
        envVar: DMS_FEDERATION_HUB_BASE_URL
      - name: gateway-service
        envVar: DMS_INSTALLATION_GATEWAY_BASE_URL
    env: {}

  # smtp_host/smtp_port-Defaults in settings.py sind bereits "mailpit"/1025
  # (deckungsgleich mit infra/docker-compose.yml) - keine expliziten
  # env-Zeilen nötig. "mailpit" bleibt bis P26-S3 (baut das echte
  # Mailpit-Deployment) ein reiner Compose-Hostname ohne k8s-Entsprechung in
  # diesem Chart - offener Punkt, siehe Session-Report (gleiches Problem bei
  # mail-connector unten).
  notification-service:
    enabled: true
    image:
      repository: dms/notification-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~687 (Host-Mapping 8015)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - auth-service
    env: {}

  case-service:
    enabled: true
    image:
      repository: dms/case-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~716 (Host-Mapping 8016)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - workflow-service
      - document-service
      - object-type-service
      - permission-service
    env: {}

  signature-service:
    enabled: true
    image:
      repository: dms/signature-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~750 (Host-Mapping 8017)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - document-service
      - object-type-service
      - auth-service
    env: {}

  # Bewusst KEIN interner Service dieser Installation (siehe
  # docs/services/federation-hub-service.md, ADR 0028) - kein
  # DMS_REGISTRY_SERVICE_BASE_URL/DMS_SELF_ADDRESS-Bedarf, kein
  # dependsOnServices. Nur der lokalen Entwicklung halber trotzdem als
  # Chart-Service mitgeliefert (Parität zu infra/docker-compose.yml). Die
  # generischen dms.baseEnv-Felder (u. a. DMS_NATS_URL/
  # DMS_REGISTRY_SERVICE_BASE_URL) werden trotzdem injiziert, da das
  # generische Template dafür keinen Opt-out kennt - unschädlich, da
  # BaseServiceSettings mit extra="ignore" unbekannte Felder klaglos
  # verwirft (siehe libs/dms-common/src/dms_common/settings.py) und dieser
  # Service sie schlicht nicht liest.
  federation-hub-service:
    enabled: true
    image:
      repository: dms/federation-hub-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~788 (Host-Mapping 8018)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    env: {}

  favorite-service:
    enabled: true
    image:
      repository: dms/favorite-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~805 (Host-Mapping 8019)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    env: {}

  # DMS_GATEWAY_BASE_URL (settings.py-Default bereits "http://localhost:8009",
  # deckungsgleich mit infra/docker-compose.yml) ist bewusst NICHT die
  # interne Cluster-Adresse, sondern die von außen (z. B. aus einer
  # Berichts-E-Mail heraus) erreichbare Gateway-Adresse - derselbe noch
  # fehlende OCP-Route-Baustein wie bei gateway-service selbst (siehe dessen
  # Kommentar oben). Deshalb hier bewusst NICHT über dependsOnServices (das
  # würde die von außen nicht erreichbare interne Cluster-DNS-Adresse
  # einsetzen) - der Compose-Paritäts-Default bleibt unverändert bestehen,
  # bis eine echte Route existiert (offener Punkt, siehe Session-Report).
  reporting-service:
    enabled: true
    image:
      repository: dms/reporting-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~827 (Host-Mapping 8020)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - workflow-service
      - audit-service
      - storage-service
      - notification-service
      - permission-service
    env: {}

  archival-service:
    enabled: true
    image:
      repository: dms/archival-service
      tag: latest
    port: 8000 # siehe infra/docker-compose.yml Zeile ~869 (Host-Mapping 8021)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - document-service
      - rendering-service
      - storage-service
      - object-type-service
      - case-service
      - permission-service
    env:
