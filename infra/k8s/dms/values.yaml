  # ---------------------------------------------------------------------
  # Ab hier: die 6 Next.js-Frontend-Apps aus infra/docker-compose.yml
  # (P26-S5, Zeilen ~1448-1543, apps/<name>/) — struktureller Unterschied zu
  # ALLEN 32 Services oben, siehe ADR 0102 für die volle Begründung:
  #
  # 1. Statisch exportierte SPA (ADR 0006, next.config.mjs `output:
  #    "export"`), ausgeliefert über nginx (apps/<name>/Dockerfile, zweite
  #    Stage `nginx:1.27-alpine`) — es gibt KEINEN Node-Prozess zur
  #    Laufzeit, der eine Umgebungsvariable lesen könnte. `NEXT_PUBLIC_*`-
  #    Variablen (Gateway-Adresse u. ä.) werden per Dockerfile-`ARG`/`ENV`
  #    VOR `RUN npm run build` in den JS-Bundle eingebrannt — überschreibbar
  #    ausschließlich als Docker-`--build-arg`, NIE als Container-Env zur
  #    Laufzeit. `env:` bleibt deshalb bei allen 6 Einträgen unten bewusst
  #    LEER: ein hier gesetzter `NEXT_PUBLIC_*`-Wert würde vom bereits
  #    fertig gebauten Bundle schlicht ignoriert — ein Helm-`fail`-Guard
  #    (`staticFrontend: true`, siehe templates/deployment.yaml) bricht
  #    `helm template`/`lint` deshalb hart ab, statt das still wirkungslos
  #    zu rendern.
  #    KONSEQUENZ für den produktiven Betrieb dieses Charts: `image.tag`
  #    unten ist bei diesen 6 Einträgen NICHT nur eine Versionsnummer wie
  #    bei den FastAPI-Services, sondern faktisch auch ein
  #    Ziel-Umgebungs-Bezeichner (z. B. "prod-eu-2026-08" statt "latest") —
  #    jede Zielumgebung mit einer anderen öffentlichen Gateway-Adresse
  #    braucht ein EIGENES, vorab mit dem passenden `--build-arg
  #    NEXT_PUBLIC_GATEWAY_BASE_URL=...` gebautes Image, BEVOR dieses Chart
  #    es referenziert. Dieses Chart selbst baut keine Images und kann
  #    NEXT_PUBLIC_*-Werte nicht nachträglich beeinflussen (reale, keine
  #    zufällige Limitation von Next.js Static Export — siehe ADR 0102).
  # 2. `healthCheckPath: "/"` statt des generischen "/healthz"-Defaults:
  #    nginx liefert hier nur statische Dateien aus (apps/<name>/
  #    nginx.conf: `try_files $uri $uri.html $uri/ =404;`) — kein
  #    FastAPI-Health-Endpunkt existiert. "/" liefert bereits vorhandenes
  #    `index.html` mit 200 zurück (reiner Datei-Response, kein
  #    Client-JS-Ausführungsbedarf) — ausreichend/passend für
  #    Liveness/Readiness einer reinen statischen SPA.
  # 3. `port: 80` statt 8000 (nginx `EXPOSE 80`, siehe Dockerfile) —
  #    templates/service.yaml setzt den Kubernetes-Service-Port trotzdem
  #    einheitlich auf 8000 für JEDEN Eintrag (targetPort verweist per Namen
  #    auf den tatsächlichen Container-Port), das bleibt hier unverändert
  #    korrekt.
  # 4. `ingress:` (templates/ingress.yaml, ADR 0102) — ein eigener
  #    Hostname je App (Platzhalter unten, je Installation zu
  #    überschreiben), NICHT ein gemeinsamer Host mit Pfad-Präfix: keine der
  #    6 next.config.mjs setzt `basePath`/`assetPrefix`, ihre
  #    `/_next/...`-Assets sind root-relativ und würden sich unter
  #    Pfad-Präfixen gegenseitig überschreiben.
  # 5. Alle generischen `dms.baseEnv`-Felder (DMS_POSTGRES_DSN/DMS_NATS_URL/
  #    DMS_REGISTRY_SERVICE_BASE_URL/...) werden trotzdem injiziert (kein
  #    Opt-out im generischen Template, gleiches bereits etabliertes Prinzip
  #    wie bei federation-hub-service/webdav-connector oben) — unschädlich,
  #    nginx liest sie nicht.
  #
  # office-addin ist eine Ausnahme unter den 6 Apps (siehe deren eigener
  # Kommentar unten): docs/services/office-addin.md dokumentiert eine
  # HTTPS-Pflicht (Office lädt Add-in-Webinhalte grundsätzlich nur über
  # HTTPS) — `ingress.tls.enabled: true` ist deshalb dort (anders als bei
  # den übrigen 5) der Default. Zusätzlich enthält `apps/office-addin/
  # manifest.xml` selbst fest eingebrannte `https://localhost:3006`-URLs
  # (IconUrl/SupportUrl/AppDomain) — eine noch tiefere Baustufe als die
  # NEXT_PUBLIC_*-Build-Args (nicht mal ein Build-Arg, sondern eine im
  # Quellcode/Image liegende XML-Datei) — dieses Chart kann sie ebenso
  # wenig zur Deploy-Zeit umschreiben, siehe ADR 0102 "Konsequenzen".
  # ---------------------------------------------------------------------
  user-ui:
    enabled: true
    image:
      repository: dms/user-ui
      tag: latest # siehe Blockkommentar oben — produktiv faktisch ein Umgebungs-Tag
    port: 80 # nginx (apps/user-ui/Dockerfile EXPOSE 80), NICHT 8000 wie die FastAPI-Services
    replicas: 2
    staticFrontend: true
    healthCheckPath: "/"
    # kein eigener resources-Block -> resources.baseline-Fallback (ausreichend
    # für eine reine statische Datei-Auslieferung über nginx).
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: true # primäre Endnutzer-App -> HA-Anspruch, analog gateway-service
      minAvailable: 1
    ingress:
      enabled: true
      className: ""
      host: "user-ui.dms.local" # Platzhalter, je Installation überschreiben (siehe Blockkommentar oben)
      path: /
      pathType: Prefix
      tls:
        enabled: false
        secretName: ""
      annotations: {}
    env: {}

  admin-ui:
    enabled: true
    image:
      repository: dms/admin-ui
      tag: latest
    port: 80
    replicas: 2
