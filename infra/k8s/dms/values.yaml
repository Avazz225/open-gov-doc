# values.yaml — DMS Helm chart (Phase 26, P26-S1 + P26-S2 + P26-S3)
#
# ONE chart for all containers from infra/docker-compose.yml. Instead of one
# template per service (34+ nearly identical copies), the
# generic templates under templates/ iterate over the `services:` map below
# (see ADR — filename see docs/adr/, "one chart, values-driven service
# map"). New services are added by adding a new entry here under
# `services:` — never via a new template.
#
# P26-S1 built the basic scaffolding + 4 real example entries (registry-service,
# gateway-service, document-service, storage-service) to prove that the
# templates actually render. P26-S2 added the remaining ~28 stateless
# FastAPI services from infra/docker-compose.yml following the same pattern — no
# new template, just further `services.<name>:` blocks. P26-S3 (this
# session) built postgresql/keycloak/minio/nats/redis (below, starting at
# "Stateful infrastructure") as real Deployments+Service(+PVC) in
# their own templates (templates/postgresql.yaml etc. — structurally too
# different for the generic services: mechanism) plus a real
# secret mechanism for their admin passwords (ADR 0100).
#
# P26-S4 added the storage replication CronJob equivalent
# (storageCronJob below, templates/storage-cronjob.yaml, ADR 0101). P26-S5
# (this session) added the 6 Next.js frontend apps (user-ui/admin-ui/
# process-designer/reviewer-ui/migration-console/office-addin) as further
# `services:` entries — structurally still "one container on one
# port", BUT with one important deviation: their NEXT_PUBLIC_* variables
# are baked in at `docker build` time, not read at runtime
# (see ADR 0102, as well as the comment block right before the 6 entries
# below). P26-S5 also built real `Ingress` resources (new optional
# `ingress:` field per service, templates/ingress.yaml) for gateway-service
# and the 6 frontend apps — the public access path announced as
# missing in the gateway-service comment since P26-S1 (see ADR 0102
# for the Ingress vs. OpenShift Route decision).
#
# Still excluded (not part of Phase 26, see
# IMPLEMENTATION_PLAN.md): azurite/mailpit/prometheus/grafana (dev emulator/
# test SMTP/observability stack, not a component of this phase mandated in
# the session briefing), postgres-wal-archive-init (a Job, not a Deployment
# — see the open point in the P26-S2 report), as well as libreoffice-addin
# (`apps/libreoffice-addin/` — a UNO `.oxt` extension, not an
# independently deployable HTTP container, hence it has no
# `infra/docker-compose.yml` entry at all and therefore no Helm counterpart either).

global:
  # Installation-wide identity (concept 3a) — corresponds to DMS_INSTALLATION_ID
  # / DMS_INSTALLATION_DISPLAY_NAME in infra/docker-compose.yml, here as
  # Helm values instead of Compose .env.
  installationId: local-dev
  installationDisplayName: "DMS-Installation (Kubernetes)"
  image:
    # Optional registry prefix, e.g. "registry.example.com/" (with
    # trailing slash) — empty = services.<name>.image.repository is used
    # unchanged. Kept separate from the individual repository paths
    # so that a registry change doesn't touch 34 entries.
    registry: ""
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# resources.baseline — default requests/limits (a hard user requirement).
# Every services.<name> without its own `resources:` block falls back to this;
# a service that specifies `resources:` (even only partially) overrides only
# the specified fields (deep-merge via `mergeOverwrite` in
# templates/_helpers.tpl, see `dms.mergedResources` there).
# ---------------------------------------------------------------------------
resources:
  baseline:
    memory:
      requests: 128Mi
      limits: 256Mi
    cpu:
      requests: 100m
      limits: 500m

# ---------------------------------------------------------------------------
# services — a map, one entry per container. Shape is identical for ALL
# services (including the ones P26-S2 still adds) — that's the whole point
# of this architecture.
#
# Expected fields per entry:
#   enabled                    - bool, false = Deployment/Service are not rendered
#   image.repository / .tag    - container image
#   port                       - container port (see infra/docker-compose.yml,
#                                 always internally 8000 for the FastAPI services)
#   replicas                   - starting replicas (usually == minReplicas when autoscaling.enabled)
#   resources                  - optional, selective override of resources.baseline
#                                 (shape: {memory: {requests, limits}, cpu: {requests, limits}})
#   autoscaling                - HPA configuration, see templates/hpa.yaml
#   podDisruptionBudget        - PDB configuration, see templates/pdb.yaml
#   dependsOnServices          - optional, list of other services.<name> keys; for each
#                                 entry a
#                                 DMS_<NAME>_BASE_URL=http://<fullname>-<name>:8000 env var
#                                 is set automatically (counterpart to the Compose DMS_*_SERVICE_BASE_URL
#                                 lines) — saves having to type every upstream URL individually in `env:`.
#   usesKeycloak                - optional bool, injects DMS_KEYCLOAK_BASE_URL (see
#                                 the dms.keycloakBaseUrl helper, respects keycloak.enabled/
#                                 external below)
#   storageTargetsEnv          - optional bool, ONLY for storage-service: injects
#                                 DMS_TARGETS/DMS_WRITE_STRATEGY/DMS_QUORUM_COUNT from the
#                                 storageService: block below (see there)
#   env                        - map of additional/overriding env vars (raw value,
#                                 no templating — for values that aren't a computed
#                                 service URL)
#   healthCheckPath            - optional, default "/healthz" (since P26-S5) — path for
#                                 the liveness/readiness probe (templates/deployment.yaml).
#                                 The 6 frontend apps set "/" (nginx instead of FastAPI,
#                                 see there).
#   staticFrontend             - optional bool (since P26-S5), set ONLY on the 6 Next.js
#                                 apps — activates a Helm `fail` guard against
#                                 accidental NEXT_PUBLIC_* entries in `env:` (see
#                                 ADR 0102, has no effect at runtime since it's baked in
#                                 at build time).
#   ingress                    - optional (since P26-S5), see templates/ingress.yaml.
#                                 Shape: {enabled, className, host, path, pathType,
#                                 tls: {enabled, secretName}, annotations}. Vanilla
#                                 k8s Ingress instead of OpenShift Route, see ADR 0102.
# ---------------------------------------------------------------------------
services:
  # --- Example 1: simple service, pure resources.baseline fallback ---
  registry-service:
    enabled: true
    image:
      repository: dms/registry-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~276 (container port, host mapping is 8001)
    replicas: 1
    # no own resources block -> entirely resources.baseline (verification case
    # "a service uses a pure baseline fallback", see PROGRESS/report)
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    env: {}

  # --- Example 2: "public route" character (reachable from outside via the gateway),
  # multiple replicas -> PDB makes sense and is switched on here to
  # actually render templates/pdb.yaml in this session. ---
  gateway-service:
    enabled: true
    image:
      repository: dms/gateway-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~1437 (host mapping 8009)
    replicas: 2
    resources:
      # selective override: only cpu, memory stays on the resources.baseline fallback
      # (verification case "a service overrides selectively")
      cpu:
        requests: 200m
        limits: 750m
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true # active in this session, to exercise templates/pdb.yaml
      minAvailable: 1
    usesKeycloak: true
    # Since P26-S3: shared rate-limit store (ADR 0097) - injects
    # DMS_REDIS_URL via the dms.redisUrl helper (bundled-only, see
    # templates/redis.yaml). The only service in this chart with
    # usesRedis: true, see services/gateway-service/src/gateway_service/settings.py.
    usesRedis: true
    # Public access path (P26-S5, see ADR 0102) — announced as an
    # open point since P26-S1 ("follows in P26-S2/S5 together with the
    # frontend apps, needs their final hostnames"), now built. `host`
    # is a dev/demo placeholder (analogous to global.installationId:
    # "local-dev") — IMPORTANT: this value MUST match the
    # NEXT_PUBLIC_GATEWAY_BASE_URL build arg that the 6
    # frontend images were built with (see their values.yaml comment
    # below) — no Helm mechanism can keep this automatically in sync,
    # since NEXT_PUBLIC_GATEWAY_BASE_URL is already baked into the
    # image before `helm install`.
    ingress:
      enabled: true
      className: ""
      host: "gateway.dms.local"
      path: /
      pathType: Prefix
      tls:
        enabled: false
        secretName: ""
      annotations: {}
    env:
      DMS_KEYCLOAK_CLIENT_ID: "dms-api"
      # Must contain every hostname under which one of the 6 frontend apps
      # is publicly reachable (see their ingress.host below) — otherwise
      # the browser blocks the cross-origin fetches against the gateway
      # (different hosts: each frontend app and the gateway have their
      # own ingress hostnames, see ADR 0102 "host-based routing").
      # "http://localhost:3000" is kept for the unchanged
      # docker-compose dev case (user-ui).
      DMS_CORS_ALLOWED_ORIGINS: '["http://localhost:3000","https://user-ui.dms.local","https://admin-ui.dms.local","https://process-designer.dms.local","https://reviewer-ui.dms.local","https://migration-console.dms.local","https://office-addin.dms.local"]'

  # --- Example 3: multiple upstream dependencies (dependsOnServices),
  # autoscaling active -> exercises templates/hpa.yaml in this session, plus
  # PDB active (a second instance alongside gateway-service). ---
  document-service:
    enabled: true
    image:
      repository: dms/document-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~481 (host mapping 8006)
    replicas: 2
    resources:
      # full override of both axes (third verification case)
      memory:
        requests: 256Mi
        limits: 512Mi
      cpu:
        requests: 150m
        limits: 600m
    autoscaling:
      enabled: true # active in this session, to exercise templates/hpa.yaml
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 80
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    dependsOnServices:
      - storage-service
      - folder-service
      - object-type-service
    env: {}

  # --- Example 4: storage-service — populates storageService.targets (below)
  # via DMS_TARGETS/DMS_WRITE_STRATEGY/DMS_QUORUM_COUNT, see
  # the storageTargetsEnv flag and dms.storageServiceTargetsEnv in _helpers.tpl.
  # Second pure baseline-fallback case (no own resources block). ---
  storage-service:
    enabled: true
    image:
      repository: dms/storage-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~433 (host mapping 8005)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    storageTargetsEnv: true
    env:
      DMS_GOVERNANCE_BYPASS_ROLE: "dms-admin"

  # ---------------------------------------------------------------------
  # From here on: the ~28 services from P26-S2 (stateless FastAPI services,
  # infra/docker-compose.yml lines ~287-1409), in the same order as
  # there. Env var names/cross-service dependencies are taken 1:1 from the
  # respective `environment:` blocks in infra/docker-compose.yml plus the
  # corresponding services/<name>/src/*/settings.py defaults (not
  # guessed) — where a settings.py default already matches the
  # infra/docker-compose.yml value, the line here is deliberately
  # NOT duplicated (lean values.yaml, same practice as
  # registry-service above). Autoscaling is only active for the 4 services that
  # the P26-S2 session report justified as "busy/horizontally scalable"
  # (virus-scan-, rendering-, ocr-, search-service) — all others stay
  # on the P26-S1 baseline pattern (1 replica, autoscaling/PDB off).
  # ---------------------------------------------------------------------

  # Audit log/deletion register ledger (concept 5.2a/10.4) - pure consumer +
  # own Postgres schema, no cross-service BASE_URL dependencies
  # beyond dms.baseEnv (registry/self-address/Postgres/NATS).
  # OPEN POINT: infra/docker-compose.yml mounts a dedicated
  # deletion-ledger-data volume for this service (deletion register ledger) - the
  # generic deployment.yaml template currently doesn't support
  # volumeMounts/PVCs (deliberately not retrofitted in this session, see
  # the session report) - without a PVC, audit-service loses this ledger on
  # every pod restart. To be caught up on in P26-S3 together with the other
  # PVC-backed components.
  audit-service:
    enabled: true
    image:
      repository: dms/audit-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~287 (host mapping 8002)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    env: {}

  # SSO/Keycloak frontend + federated contact search (concept 2.5/4.4/7.4).
  # usesKeycloak for DMS_KEYCLOAK_BASE_URL; keycloak_client_secret/
  # keycloak_admin_username/keycloak_admin_password defaults in settings.py
  # already match infra/docker-compose.yml (dms-api-dev-secret/
  # admin/admin_dev_only) - deliberately not duplicated here.
  # dependsOnServices uses the dict form for federation-hub-service/gateway-service,
  # extended since this session (P26-S2, see _helpers.tpl),
  # because their infra/docker-compose.yml env var names
  # (DMS_FEDERATION_HUB_BASE_URL/DMS_INSTALLATION_GATEWAY_BASE_URL) deviate from
  # the standard pattern DMS_<KEY>_BASE_URL.
  auth-service:
    enabled: true
    image:
      repository: dms/auth-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~317 (host mapping 8003)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    usesKeycloak: true
    dependsOnServices:
      - permission-service
      - name: federation-hub-service
        envVar: DMS_FEDERATION_HUB_BASE_URL
      - name: gateway-service
        envVar: DMS_INSTALLATION_GATEWAY_BASE_URL
    env:
      # settings.py default for keycloak_public_base_url is None (SSO
      # browser redirect flow off) - infra/docker-compose.yml enables it
      # dev-typically with the externally mapped Keycloak address. In this
      # chart there is no real OCP route for Keycloak yet (P26-S3 builds
      # the real Keycloak deployment) - a placeholder, the same open
      # problem as with gateway-service (CORS/route, see its comment
      # above).
      DMS_KEYCLOAK_PUBLIC_BASE_URL: "http://localhost:8080"
      # settings.py default is False (federated contact search is, per
      # concept 2.5, literally opt-in) - infra/docker-compose.yml turns it
      # on dev-typically for the self-loopback smoke test, likewise here for
      # parity.
      DMS_FEDERATED_DIRECTORY_ENABLED: "true"

  permission-service:
    enabled: true
    image:
      repository: dms/permission-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~364 (host mapping 8004)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - auth-service
    env: {}

  # Part of the upload hot-path pipeline (document-service calls it synchronously) -
  # therefore scales horizontally too (one of the P26-S2 autoscaling picks,
  # see the session report). scan_engine default in settings.py is already
  # "eicar" (matching infra/docker-compose.yml) - no explicit
  # env line needed.
  virus-scan-service:
    enabled: true
    image:
      repository: dms/virus-scan-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~500 (host mapping 8010)
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    dependsOnServices:
      - storage-service
      - document-service
      - permission-service
    env: {}

  # LibreOffice headless conversion (docs/services/rendering-service.md)
  # is more CPU/memory-intensive than the standard FastAPI service (soffice
  # runs as its own subprocess per conversion) - resources override instead of
  # a pure baseline fallback. Horizontally scalable (no local
  # state, every conversion gets an isolated
  # UserInstallation profile, see docs) - one of the P26-S2 autoscaling
  # picks.
  rendering-service:
    enabled: true
    image:
      repository: dms/rendering-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~537 (host mapping 8011)
    replicas: 2
    resources:
      memory:
        requests: 512Mi
        limits: 1Gi
      cpu:
        requests: 300m
        limits: 1000m
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    dependsOnServices:
      - storage-service
      - document-service
      - ocr-service
      - permission-service
    env: {}

  # Tesseract OCR (docs/services/ocr-service.md) is CPU-intensive per
  # page/image - resources override. Optional service (Compose profile
  # "ocr", active by default per .env.example) - here controlled simply via
  # `enabled` like every other service, no dedicated profile equivalent
  # needed in this chart. Horizontally scalable (each extraction is
  # independent), but without HA requirements when idle -> minReplicas 1 instead of 2
  # and PDB off (a single-replica PDB with minAvailable:1 would
  # block node drains, same principle as registry-service/
  # storage-service above).
  ocr-service:
    enabled: true
    image:
      repository: dms/ocr-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~578 (host mapping 8012)
    replicas: 1
    resources:
      memory:
        requests: 384Mi
        limits: 768Mi
      cpu:
        requests: 300m
        limits: 1200m
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - storage-service
      - document-service
      - permission-service
    env: {}

  # Postgres FTS/trigram search (docs/services/search-service.md) - the
  # actual compute load lies server-side in the (bundled) Postgres,
  # not in this service itself; still a moderate memory override
  # for connection pooling/query building under parallel load. A classic
  # horizontally scalable read path (stateless, no local cache per
  # concept 2.4) - one of the P26-S2 autoscaling picks.
  search-service:
    enabled: true
    image:
      repository: dms/search-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~610 (host mapping 8013)
    replicas: 2
    resources:
      memory:
        requests: 192Mi
        limits: 384Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    dependsOnServices:
      - document-service
      - folder-service
      - object-type-service
      - permission-service
      - ocr-service
      - rendering-service
    env: {}

  # sla_poll_interval_seconds/federation_process_type_map defaults in
  # settings.py already match infra/docker-compose.yml (30 / "{}")
  # - no explicit env lines needed. dependsOnServices uses the same dict
  # form for federation-hub-service/gateway-service as
  # auth-service above, same reason (the Compose env var name deviates from
  # the DMS_<KEY>_BASE_URL pattern).
  workflow-service:
    enabled: true
    image:
      repository: dms/workflow-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~648 (host mapping 8014)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - permission-service
      - signature-service
      - name: federation-hub-service
        envVar: DMS_FEDERATION_HUB_BASE_URL
      - name: gateway-service
        envVar: DMS_INSTALLATION_GATEWAY_BASE_URL
    env: {}

  # smtp_host/smtp_port defaults in settings.py are already "mailpit"/1025
  # (matching infra/docker-compose.yml) - no explicit
  # env lines needed. "mailpit" remains, until P26-S3 (builds the real
  # Mailpit deployment), a pure Compose hostname without a k8s equivalent in
  # this chart - an open point, see the session report (same issue for
  # mail-connector below).
  notification-service:
    enabled: true
    image:
      repository: dms/notification-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~687 (host mapping 8015)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - auth-service
    env: {}

  case-service:
    enabled: true
    image:
      repository: dms/case-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~716 (host mapping 8016)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - workflow-service
      - document-service
      - object-type-service
      - permission-service
    env: {}

  signature-service:
    enabled: true
    image:
      repository: dms/signature-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~750 (host mapping 8017)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - document-service
      - object-type-service
      - auth-service
    env: {}

  # Deliberately NOT an internal service of this installation (see
  # docs/services/federation-hub-service.md, ADR 0028) - no
  # DMS_REGISTRY_SERVICE_BASE_URL/DMS_SELF_ADDRESS need, no
  # dependsOnServices. Still included as a chart service purely for the sake of
  # local development (parity with infra/docker-compose.yml). The
  # generic dms.baseEnv fields (among others DMS_NATS_URL/
  # DMS_REGISTRY_SERVICE_BASE_URL) are still injected, since the
  # generic template has no opt-out for that - harmless, since
  # BaseServiceSettings with extra="ignore" drops unknown fields without
  # complaint (see libs/dms-common/src/dms_common/settings.py) and this
  # service simply doesn't read them.
  federation-hub-service:
    enabled: true
    image:
      repository: dms/federation-hub-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~788 (host mapping 8018)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    env: {}

  favorite-service:
    enabled: true
    image:
      repository: dms/favorite-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~805 (host mapping 8019)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    env: {}

  # DMS_GATEWAY_BASE_URL (settings.py default already "http://localhost:8009",
  # matching infra/docker-compose.yml) is deliberately NOT the
  # internal cluster address, but the gateway address reachable from
  # outside (e.g. from within a report email) - the same still-
  # missing OCP route piece as with gateway-service itself (see its
  # comment above). Therefore deliberately NOT via dependsOnServices here (that
  # would use the internal cluster DNS address, which is unreachable from
  # outside) - the Compose parity default stays unchanged
  # until a real route exists (an open point, see the session report).
  reporting-service:
    enabled: true
    image:
      repository: dms/reporting-service
      tag: latest
    port: 8000 # see infra/docker-compose.yml line ~827 (host mapping 8020)
    replicas: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    dependsOnServices:
      - workflow-service
      - audit-service
      - storage-service
      - notification-service
      - permission-service
    env: {}

  archival-service:
    enabled: true
    image:
      repository: dms/archival-service
