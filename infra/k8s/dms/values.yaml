  # Ausnahme unter den 6 Frontend-Apps, siehe Blockkommentar oben:
  # HTTPS-Pflicht (docs/services/office-addin.md, Office lädt
  # Add-in-Webinhalte nur über HTTPS) -> tls.enabled Default hier bewusst
  # true (bei den übrigen 5 Apps false). `tls.secretName` bleibt trotzdem
  # leer (Platzhalter) — ein echtes TLS-Secret für den gewählten
  # ingress.host bereitzustellen (z. B. via cert-manager, über
  # `annotations:` anzubinden) ist ein Vorbereitungsschritt je Installation,
  # kein Bestandteil dieses Charts. `manifest.xml`/`assets/` sind kein
  # Next.js-Build-Ausgang (siehe Dockerfile COPY-Zeilen) — trotzdem
  # weiterhin über denselben nginx-Container ausgeliefert, kein separater
  # Service/Port nötig.
  office-addin:
    enabled: true
    image:
      repository: dms/office-addin
      tag: latest
    port: 80
    replicas: 1
    staticFrontend: true
    healthCheckPath: "/"
    autoscaling:
      enabled: false
