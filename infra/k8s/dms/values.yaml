  # ---------------------------------------------------------------------
  # From here on: the 6 Next.js frontend apps from infra/docker-compose.yml
  # (P26-S5, lines ~1448-1543, apps/<name>/) — a structural difference from
  # ALL 32 services above, see ADR 0102 for the full rationale:
  #
  # 1. Statically exported SPA (ADR 0006, next.config.mjs `output:
  #    "export"`), served via nginx (apps/<name>/Dockerfile, second
  #    stage `nginx:1.27-alpine`) — there is NO Node process at
  #    runtime that could read an environment variable. `NEXT_PUBLIC_*`
  #    variables (gateway address etc.) are baked into the JS bundle via
  #    Dockerfile `ARG`/`ENV` BEFORE `RUN npm run build` — overridable
  #    exclusively as a Docker `--build-arg`, NEVER as a container env at
  #    runtime. `env:` therefore stays deliberately
  #    EMPTY on all 6 entries below: a `NEXT_PUBLIC_*` value set here
  #    would simply be ignored by the already-built bundle — a Helm `fail`
  #    guard (`staticFrontend: true`, see templates/deployment.yaml) hard-
  #    aborts `helm template`/`lint` because of this, instead of silently
  #    rendering it without effect.
  #    CONSEQUENCE for productive operation of this chart: `image.tag`
  #    below is, for these 6 entries, NOT just a version number like
  #    for the FastAPI services, but effectively also a
  #    target-environment identifier (e.g. "prod-eu-2026-08" instead of "latest") —
  #    every target environment with a different public gateway address
  #    needs its OWN image, built beforehand with the matching `--build-arg
  #    NEXT_PUBLIC_GATEWAY_BASE_URL=...`, BEFORE this chart
  #    references it. This chart itself builds no images and cannot
  #    influence NEXT_PUBLIC_* values after the fact (a real, not a
  #    coincidental, limitation of Next.js Static Export — see ADR 0102).
  # 2. `healthCheckPath: "/"` instead of the generic "/healthz" default:
  #    nginx here only serves static files (apps/<name>/
  #    nginx.conf: `try_files $uri $uri.html $uri/ =404;`) — no
  #    FastAPI health endpoint exists. "/" returns the already-present
  #    `index.html` with 200 (a pure file response, no
  #    client-JS execution needed) — sufficient/appropriate for
  #    liveness/readiness of a pure static SPA.
  # 3. `port: 80` instead of 8000 (nginx `EXPOSE 80`, see the Dockerfile) —
  #    templates/service.yaml still sets the Kubernetes service port
  #    uniformly to 8000 for EVERY entry (targetPort refers by name
  #    to the actual container port), which remains correct here unchanged.
  # 4. `ingress:` (templates/ingress.yaml, ADR 0102) — a dedicated
  #    hostname per app (a placeholder below, to be overridden per
  #    installation), NOT a shared host with a path prefix: none of the
  #    6 next.config.mjs set `basePath`/`assetPrefix`, their
  #    `/_next/...` assets are root-relative and would overwrite each other
  #    under path prefixes.
  # 5. All generic `dms.baseEnv` fields (DMS_POSTGRES_DSN/DMS_NATS_URL/
  #    DMS_REGISTRY_SERVICE_BASE_URL/...) are still injected (no
  #    opt-out in the generic template, the same already-established principle
  #    as with federation-hub-service/webdav-connector above) — harmless,
  #    nginx doesn't read them.
  #
  # office-addin is an exception among the 6 apps (see its own
  # comment below): docs/services/office-addin.md documents an
  # HTTPS requirement (Office only ever loads add-in web content over
  # HTTPS) — `ingress.tls.enabled: true` is therefore the default there (unlike
  # the other 5). Additionally, `apps/office-addin/
  # manifest.xml` itself contains hardcoded `https://localhost:3006` URLs
  # (IconUrl/SupportUrl/AppDomain) — an even deeper baking stage than the
  # NEXT_PUBLIC_* build args (not even a build arg, but an
  # XML file living in the source code/image) — this chart can just as
  # little rewrite it at deploy time, see ADR 0102 "Consequences".
  # ---------------------------------------------------------------------
  user-ui:
    enabled: true
    image:
      repository: dms/user-ui
      tag: latest # see the block comment above — effectively an environment tag in production
    port: 80 # nginx (apps/user-ui/Dockerfile EXPOSE 80), NOT 8000 like the FastAPI services
    replicas: 2
    staticFrontend: true
    healthCheckPath: "/"
    # no own resources block -> resources.baseline fallback (sufficient
    # for pure static file serving via nginx).
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: true # primary end-user app -> HA requirement, analogous to gateway-service
      minAvailable: 1
    ingress:
      enabled: true
      className: ""
      host: "user-ui.dms.local" # placeholder, override per installation (see the block comment above)
      path: /
      pathType: Prefix
      tls:
        enabled: false
        secretName: ""
      annotations: {}
    env: {}

  admin-ui:
    enabled: true
    image:
      repository: dms/admin-ui
      tag: latest
    port: 80
    replicas: 2
    staticFrontend: true
    healthCheckPath: "/"
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 75
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    ingress:
      enabled: true
      className: ""
      host: "admin-ui.dms.local"
      path: /
      pathType: Prefix
      tls:
