        secretName: ""
      annotations: {}
    env: {}

  # Specialized admin/business tool (BPMN process designer), lower
  # expected user count/concurrent load than user-ui/admin-ui -> one replica
  # without a PDB, analogous to registry-service above (a single-replica PDB with
  # minAvailable:1 would block node drains).
  process-designer:
