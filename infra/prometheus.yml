# Static scrape configuration (10.1, P11-S1): Prometheus scrapes
# exclusively `monitoring-service` - its /metrics endpoint live-aggregates
# the scraped domain-service sensors (currently registry-service/document-service
# as pilots, see P11-S0 finding). An automatic target list derived from the
# registry (concept 10.1 mentions this as an option) is
# deliberate follow-up work - with only one target it doesn't provide any
# added value at this stage of development yet.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: monitoring-service
    static_configs:
      - targets: ["monitoring-service:8000"]
