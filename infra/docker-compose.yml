# Lokale Dev-Basisinfrastruktur (Konzept 3.1/3.4/3.6/4.4) + fachliche Services,
# die gemäß Roadmap (../IMPLEMENTATION_PLAN.md) schrittweise ergänzt werden.
#
# Nutzung:
#   cp .env.example .env
#   docker compose up -d

name: dms

networks:
  dms-net:
    driver: bridge

volumes:
  postgres-data:
  # WAL-Archivierung für Point-in-Time-Recovery (10.4, P11-S3) - separates
  # Volume statt Unterordner in postgres-data, damit ein Restore-Skript das
  # Archiv unabhängig vom (ggf. verworfenen) Live-Datenverzeichnis mounten
  # kann.
  postgres-wal-archive:
  nats-data:
  keycloak-data:
  minio-data:
  # Steht für den PVC-Mountpunkt in einer echten Installation (Konzept 3.6) -
  # ob dahinter NFS oder ein Block-Volume liegt, ist für storage-service unsichtbar.
  storage-local-data:
  # Separates Archiv-Ziel (5.6, seit P7-S3) - eigenes Volume, da ein
  # `role="archive"`-Ziel laut Konzept typischerweise ein anderes/günstigeres
  # Backend als die Live-Ziele ist, hier als zweites lokales Verzeichnis
  # stellvertretend simuliert.
  storage-archive-data:
  # Grafana-eigene SQLite-DB (Sitzungen, Nutzer) - Dashboards/Datasource selbst
  # kommen deklarativ aus infra/grafana/ (Provisioning), dieses Volume sichert
  # nur den sonstigen Grafana-internen Zustand über Neustarts hinweg.
  grafana-data:
  # Löschregister-Ledger (10.4, P11-S4) - siehe audit-service-Kommentar oben.
  deletion-ledger-data:

services:
  # Ein frisch angelegtes Docker-Volume gehört zunächst root - der
  # postgres-Prozess (Nutzer `postgres`) kann dann nicht in /wal-archive
  # schreiben (echter, live entdeckter Fehlschlag beim ersten Start: "cp:
  # can't create '/wal-archive/...': Permission denied"). Dieser einmalige
  # Init-Dienst behebt das reproduzierbar bei jedem `docker compose up`,
  # statt einen manuellen `chown`-Schritt vorauszusetzen.
  postgres-wal-archive-init:
    image: postgres:16-alpine
    user: root
    command: ["sh", "-c", "chown -R postgres:postgres /wal-archive"]
    volumes:
      - postgres-wal-archive:/wal-archive
    networks:
      - dms-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # WAL-Archivierung (10.4, P11-S3) - einfachstes offiziell dokumentiertes
    # Muster (`cp`-Archive-Command, kein pgBackRest/Barman nötig): jedes
    # fertige WAL-Segment landet zusätzlich zum laufenden pg_wal/ dauerhaft
    # unter /wal-archive (eigenes Volume) - Grundlage für Point-in-Time-
    # Recovery in scripts/backup.sh/restore.sh. `test ! -f ...` macht den
    # Befehl idempotent (Postgres wiederholt archive_command bei Fehlern).
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
      - -c
      - max_wal_senders=3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dms_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-dms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres-wal-archive:/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres-wal-archive-init:
        condition: service_completed_successfully
    networks:
      - dms-net

  # Keycloak nutzt dieselbe Postgres-Instanz (Konzept 10.4) — eigenes Schema, kein separater DB-Server.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dms}?currentSchema=keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-dms}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-dms_dev_only}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Kein curl/wget im Keycloak-Image - roher HTTP-Check über bash /dev/tcp
      # gegen den öffentlichen Realm-Endpoint (kein Health-Extension nötig).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - dms-net

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dms-net

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dms_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dms_minio_dev_only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dms-net

  # Dev-SMTP-Testserver für notification-service (P6-S2, Konzept 7.1) - fängt jede
  # Mail ab, kein echter Versand, Web-UI zum Prüfen unter MAILPIT_UI_PORT. Kein
  # Healthcheck nötig, da kein anderer Service beim Start hart auf ihn wartet -
  # ein einzelner fehlgeschlagener E-Mail-Zustellversuch bleibt als "failed" stehen
  # (siehe docs/services/notification-service.md), kein Blocker für den Service-Start.
  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - dms-net

  registry-service:
    build:
      context: ..
      dockerfile: services/registry-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      # Registriert sich seit P4-S3 bei sich selbst, damit das Gateway auch
      # "registry-service" als service_type auflösen kann (z. B. Admin-UI).
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://registry-service:8000
      # Lizenzvermittlung (Konzept 3.2b/9.3, P9-S2) - license-service
      # hängt selbst NICHT von registry-service ab (nur env-var, kein
      # depends_on), ein Zyklus entsteht hier also nicht.
      DMS_LICENSE_SERVICE_BASE_URL: http://license-service:8000
      # Bewusst leer in diesem gebündelten Dev-/Test-Stack (Code-Default ist
      # {"workflow-service": "demo"}): ohne Lizenzausstellungswerkzeug (ADR
      # 0032) ist in dieser Umgebung nie eine gültige Lizenz installiert -
      # der Produktions-Default würde workflow-service dauerhaft in den
      # Demo-Modus versetzen und andere Services' Integrationstests brechen,
      # die real gegen den laufenden workflow-service-Container schreiben
      # (siehe case-service). Eine echte Installation überschreibt diese
      # Variable nicht (nutzt den Code-Default).
      DMS_LICENSABLE_COMPONENTS: ${REGISTRY_SERVICE_LICENSABLE_COMPONENTS:-{}}
      # Sensor-Konzept (10.1, P11-S1) - monitoring-service haengt selbst NICHT
      # von registry-service ab (kein depends_on hier), ein Zyklus entsteht
      # also nicht, gleiches Muster wie beim license-service oben.
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
    ports:
      - "${REGISTRY_SERVICE_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      license-service:
        condition: service_started
    networks:
      - dms-net

  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      # Selbst-Registrierung bei der Registry (3.2a, seit P4-S1) - Grundlage
      # für das Gateway-Routing (3.5). Adresse ist die interne Compose-DNS,
      # unter der andere Container diesen Service erreichen.
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://audit-service:8000
    volumes:
      # Löschregister-Ledger (10.4, P11-S4) - eigenes Volume, bewusst
      # getrennt von der gemeinsamen Postgres-Instanz, damit ein DB-Restore
      # (scripts/restore.sh) es nicht mit zurückrollt.
      - deletion-ledger-data:/deletion-ledger
    ports:
      - "${AUDIT_SERVICE_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - dms-net

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_KEYCLOAK_BASE_URL: http://keycloak:8080
      DMS_KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      DMS_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      DMS_KEYCLOAK_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET:-dms-api-dev-secret}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://auth-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_NATS_URL: nats://nats:4222
    ports:
      - "${AUTH_SERVICE_PORT:-8003}:8000"
    depends_on:
      keycloak:
        condition: service_healthy
      permission-service:
        condition: service_started
      nats:
        condition: service_healthy
    networks:
      - dms-net

  permission-service:
    build:
      context: ..
      dockerfile: services/permission-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://permission-service:8000
      # Kein `depends_on: auth-service` hier (würde einen Zyklus mit
      # auth-services `depends_on: permission-service` aus P6-S5 bilden,
      # Docker Compose verbietet das). Unkritisch: der Aufruf passiert nur bei
      # `POST /maintenance-mode/lift` zur Laufzeit, nicht beim eigenen Start.
      DMS_AUTH_SERVICE_BASE_URL: http://auth-service:8000
    ports:
      - "${PERMISSION_SERVICE_PORT:-8004}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - dms-net

  storage-service:
    build:
      context: ..
      dockerfile: services/storage-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      # Ziel-Set (3.6, seit P5b-S6 eine echte Liste statt fester backend/
      # secondary_backend-Slots - siehe ADR 0004/0017): Default ein einzelnes
      # lokales Ziel (steht für NFS/PVC-Mount). Beliebig viele, auch
      # gleichartige Ziele möglich, z. B. zum Testen von Redundanz/Quorum:
      #   STORAGE_SERVICE_TARGETS='[{"id":"local","type":"local","base_path":"/data/storage"},
      #     {"id":"s3-minio","type":"s3","endpoint_url":"http://minio:9000",
      #      "access_key":"dms_minio","secret_key":"dms_minio_dev_only",
      #      "bucket":"dms-storage","region":"us-east-1"}]'
      #   STORAGE_SERVICE_WRITE_STRATEGY=quorum STORAGE_SERVICE_QUORUM_COUNT=2
      # Env-Var-Werte werden nicht weiter expandiert - MinIO-Zugangsdaten in
      # einer eigenen STORAGE_SERVICE_TARGETS-Überschreibung müssen deshalb
      # wörtlich eingetragen werden, nicht als ${MINIO_ROOT_USER}-Referenz.
      # Zweites Ziel mit `role: archive` (5.6, seit P7-S3) - nicht Teil der
      # regulären Upload-Replikation (`resolve_targets` filtert es heraus),
      # nur über die dedizierten `.../archive-copy`-Endpunkte erreichbar.
      DMS_TARGETS: >-
        ${STORAGE_SERVICE_TARGETS:-[{"id":"local","type":"local","base_path":"/data/storage"},
        {"id":"archive","type":"local","base_path":"/data/archive","role":"archive"}]}
      DMS_WRITE_STRATEGY: ${STORAGE_SERVICE_WRITE_STRATEGY:-primary_async}
      DMS_QUORUM_COUNT: ${STORAGE_SERVICE_QUORUM_COUNT:-1}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://storage-service:8000
      # Rolle für den Governance-Mode-Bypass bei Zwangslöschung (5.2a, seit
      # P7-S1) - muss mit document-services `DOCUMENT_SERVICE_GOVERNANCE_
      # BYPASS_ROLE` übereinstimmen, siehe ADR 0030.
      DMS_GOVERNANCE_BYPASS_ROLE: ${STORAGE_SERVICE_GOVERNANCE_BYPASS_ROLE:-dms-admin}
    volumes:
      - storage-local-data:/data/storage
      - storage-archive-data:/data/archive
    ports:
      - "${STORAGE_SERVICE_PORT:-8005}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dms-net

  document-service:
    build:
      context: ..
      dockerfile: services/document-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_FOLDER_SERVICE_BASE_URL: http://folder-service:8000
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      DMS_VIRUS_SCAN_SERVICE_BASE_URL: http://virus-scan-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://document-service:8000
      # Lizenz-Limit-Blockade bei Neuanlagen (Konzept 9.3, P9-S2). Bewusst
      # ohne depends_on: license-service haengt selbst von document-service
      # ab (Dokumentenzaehler, P9-S1) - ein umgekehrtes depends_on waere ein
      # Zyklus. Der Check ist ohnehin fail-open (TTL-Cache), kein Hard-
      # Dependency beim Start.
      DMS_LICENSE_SERVICE_BASE_URL: http://license-service:8000
      # Aufbewahrung/Legal Hold/Zwangslöschung (5.2/5.2a, seit P7-S1): wie oft
      # der Poll-Loop fällige Fristen prüft, sowie die Rolle für den
      # Governance-Bypass bei Zwangslöschung (muss zu storage-services
      # `STORAGE_SERVICE_GOVERNANCE_BYPASS_ROLE` passen, siehe ADR 0030).
      DMS_RETENTION_POLL_INTERVAL_SECONDS: ${DOCUMENT_SERVICE_RETENTION_POLL_INTERVAL_SECONDS:-3600}
      DMS_GOVERNANCE_BYPASS_ROLE: ${DOCUMENT_SERVICE_GOVERNANCE_BYPASS_ROLE:-dms-admin}
      # Sensor-Konzept (10.1, P11-S1) - kein depends_on, gleiches fail-open
      # Muster wie beim Lizenz-Client oben.
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
    ports:
      - "${DOCUMENT_SERVICE_PORT:-8006}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      storage-service:
        condition: service_started
      folder-service:
        condition: service_started
      object-type-service:
        condition: service_started
      virus-scan-service:
        condition: service_started
      permission-service:
        condition: service_started
    networks:
      - dms-net

  virus-scan-service:
    build:
      context: ..
      dockerfile: services/virus-scan-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_SCAN_ENGINE: ${VIRUS_SCAN_ENGINE:-eicar}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://virus-scan-service:8000
    ports:
      - "${VIRUS_SCAN_SERVICE_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      storage-service:
        condition: service_started
    networks:
      - dms-net

  rendering-service:
    build:
      context: ..
      dockerfile: services/rendering-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_OCR_SERVICE_BASE_URL: http://ocr-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://rendering-service:8000
    ports:
      - "${RENDERING_SERVICE_PORT:-8011}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      storage-service:
        condition: service_started
      document-service:
        condition: service_started
    networks:
      - dms-net

  # Optional (3.9, P5b-S5, ADR 0016): ocrEnabled=false bedeutet, dieser
  # Container wird gar nicht erst deployt (Compose-Profil-Opt-out) statt
  # laufend "aus" zu sein - konsistent mit dem "Dazustellen"-Prinzip. Aktiv,
  # sobald das Profil "ocr" eingeschaltet ist (siehe COMPOSE_PROFILES in
  # .env.example, standardmäßig aktiv). rendering-service/search-service
  # hängen deshalb bewusst NICHT per depends_on an diesem Service - beide
  # tolerieren seine Abwesenheit bereits über ihre HTTP-Clients
  # (search-service: schon vorhandenes try/except; rendering-service: neu in
  # dieser Session ergänzt, siehe consumer.py).
  ocr-service:
    build:
      context: ..
      dockerfile: services/ocr-service/Dockerfile
    restart: unless-stopped
    profiles: ["ocr"]
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://ocr-service:8000
    ports:
      - "${OCR_SERVICE_PORT:-8012}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      storage-service:
        condition: service_started
      document-service:
        condition: service_started
    networks:
      - dms-net

  search-service:
    build:
      context: ..
      dockerfile: services/search-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
