# Lokale Dev-Basisinfrastruktur (Konzept 3.1/3.4/3.6/4.4) + fachliche Services,
# die gemäß Roadmap (../IMPLEMENTATION_PLAN.md) schrittweise ergänzt werden.
#
# Nutzung:
#   cp .env.example .env
#   docker compose up -d

name: dms

networks:
  dms-net:
    driver: bridge

volumes:
  postgres-data:
  nats-data:
  keycloak-data:
  minio-data:
  # Steht für den PVC-Mountpunkt in einer echten Installation (Konzept 3.6) -
  # ob dahinter NFS oder ein Block-Volume liegt, ist für storage-service unsichtbar.
  storage-local-data:
  # Separates Archiv-Ziel (5.6, seit P7-S3) - eigenes Volume, da ein
  # `role="archive"`-Ziel laut Konzept typischerweise ein anderes/günstigeres
  # Backend als die Live-Ziele ist, hier als zweites lokales Verzeichnis
  # stellvertretend simuliert.
  storage-archive-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dms_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-dms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dms-net

  # Keycloak nutzt dieselbe Postgres-Instanz (Konzept 10.4) — eigenes Schema, kein separater DB-Server.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dms}?currentSchema=keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-dms}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-dms_dev_only}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Kein curl/wget im Keycloak-Image - roher HTTP-Check über bash /dev/tcp
      # gegen den öffentlichen Realm-Endpoint (kein Health-Extension nötig).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - dms-net

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dms-net

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dms_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dms_minio_dev_only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dms-net

  # Dev-SMTP-Testserver für notification-service (P6-S2, Konzept 7.1) - fängt jede
  # Mail ab, kein echter Versand, Web-UI zum Prüfen unter MAILPIT_UI_PORT. Kein
  # Healthcheck nötig, da kein anderer Service beim Start hart auf ihn wartet -
  # ein einzelner fehlgeschlagener E-Mail-Zustellversuch bleibt als "failed" stehen
  # (siehe docs/services/notification-service.md), kein Blocker für den Service-Start.
  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - dms-net

  registry-service:
    build:
      context: ..
      dockerfile: services/registry-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      # Registriert sich seit P4-S3 bei sich selbst, damit das Gateway auch
      # "registry-service" als service_type auflösen kann (z. B. Admin-UI).
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://registry-service:8000
    ports:
      - "${REGISTRY_SERVICE_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - dms-net

  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      # Selbst-Registrierung bei der Registry (3.2a, seit P4-S1) - Grundlage
      # für das Gateway-Routing (3.5). Adresse ist die interne Compose-DNS,
      # unter der andere Container diesen Service erreichen.
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://audit-service:8000
    ports:
      - "${AUDIT_SERVICE_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - dms-net

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_KEYCLOAK_BASE_URL: http://keycloak:8080
      DMS_KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      DMS_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      DMS_KEYCLOAK_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET:-dms-api-dev-secret}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://auth-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_NATS_URL: nats://nats:4222
    ports:
      - "${AUTH_SERVICE_PORT:-8003}:8000"
    depends_on:
      keycloak:
        condition: service_healthy
      permission-service:
        condition: service_started
      nats:
        condition: service_healthy
    networks:
      - dms-net

  permission-service:
    build:
      context: ..
      dockerfile: services/permission-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://permission-service:8000
      # Kein `depends_on: auth-service` hier (würde einen Zyklus mit
      # auth-services `depends_on: permission-service` aus P6-S5 bilden,
      # Docker Compose verbietet das). Unkritisch: der Aufruf passiert nur bei
      # `POST /maintenance-mode/lift` zur Laufzeit, nicht beim eigenen Start.
      DMS_AUTH_SERVICE_BASE_URL: http://auth-service:8000
    ports:
      - "${PERMISSION_SERVICE_PORT:-8004}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - dms-net

  storage-service:
    build:
      context: ..
      dockerfile: services/storage-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      # Ziel-Set (3.6, seit P5b-S6 eine echte Liste statt fester backend/
      # secondary_backend-Slots - siehe ADR 0004/0017): Default ein einzelnes
      # lokales Ziel (steht für NFS/PVC-Mount). Beliebig viele, auch
      # gleichartige Ziele möglich, z. B. zum Testen von Redundanz/Quorum:
      #   STORAGE_SERVICE_TARGETS='[{"id":"local","type":"local","base_path":"/data/storage"},
      #     {"id":"s3-minio","type":"s3","endpoint_url":"http://minio:9000",
      #      "access_key":"dms_minio","secret_key":"dms_minio_dev_only",
      #      "bucket":"dms-storage","region":"us-east-1"}]'
      #   STORAGE_SERVICE_WRITE_STRATEGY=quorum STORAGE_SERVICE_QUORUM_COUNT=2
      # Env-Var-Werte werden nicht weiter expandiert - MinIO-Zugangsdaten in
      # einer eigenen STORAGE_SERVICE_TARGETS-Überschreibung müssen deshalb
      # wörtlich eingetragen werden, nicht als ${MINIO_ROOT_USER}-Referenz.
      # Zweites Ziel mit `role: archive` (5.6, seit P7-S3) - nicht Teil der
      # regulären Upload-Replikation (`resolve_targets` filtert es heraus),
      # nur über die dedizierten `.../archive-copy`-Endpunkte erreichbar.
      DMS_TARGETS: >-
        ${STORAGE_SERVICE_TARGETS:-[{"id":"local","type":"local","base_path":"/data/storage"},
        {"id":"archive","type":"local","base_path":"/data/archive","role":"archive"}]}
      DMS_WRITE_STRATEGY: ${STORAGE_SERVICE_WRITE_STRATEGY:-primary_async}
      DMS_QUORUM_COUNT: ${STORAGE_SERVICE_QUORUM_COUNT:-1}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://storage-service:8000
      # Rolle für den Governance-Mode-Bypass bei Zwangslöschung (5.2a, seit
      # P7-S1) - muss mit document-services `DOCUMENT_SERVICE_GOVERNANCE_
      # BYPASS_ROLE` übereinstimmen, siehe ADR 0030.
      DMS_GOVERNANCE_BYPASS_ROLE: ${STORAGE_SERVICE_GOVERNANCE_BYPASS_ROLE:-dms-admin}
    volumes:
      - storage-local-data:/data/storage
      - storage-archive-data:/data/archive
    ports:
      - "${STORAGE_SERVICE_PORT:-8005}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dms-net

  document-service:
    build:
      context: ..
      dockerfile: services/document-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_FOLDER_SERVICE_BASE_URL: http://folder-service:8000
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      DMS_VIRUS_SCAN_SERVICE_BASE_URL: http://virus-scan-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://document-service:8000
      # Aufbewahrung/Legal Hold/Zwangslöschung (5.2/5.2a, seit P7-S1): wie oft
      # der Poll-Loop fällige Fristen prüft, sowie die Rolle für den
      # Governance-Bypass bei Zwangslöschung (muss zu storage-services
      # `STORAGE_SERVICE_GOVERNANCE_BYPASS_ROLE` passen, siehe ADR 0030).
      DMS_RETENTION_POLL_INTERVAL_SECONDS: ${DOCUMENT_SERVICE_RETENTION_POLL_INTERVAL_SECONDS:-3600}
      DMS_GOVERNANCE_BYPASS_ROLE: ${DOCUMENT_SERVICE_GOVERNANCE_BYPASS_ROLE:-dms-admin}
    ports:
      - "${DOCUMENT_SERVICE_PORT:-8006}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      storage-service:
        condition: service_started
      folder-service:
        condition: service_started
      object-type-service:
        condition: service_started
      virus-scan-service:
        condition: service_started
      permission-service:
        condition: service_started
    networks:
      - dms-net

  virus-scan-service:
    build:
      context: ..
      dockerfile: services/virus-scan-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_SCAN_ENGINE: ${VIRUS_SCAN_ENGINE:-eicar}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://virus-scan-service:8000
    ports:
      - "${VIRUS_SCAN_SERVICE_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      storage-service:
        condition: service_started
    networks:
      - dms-net

  rendering-service:
    build:
      context: ..
      dockerfile: services/rendering-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_OCR_SERVICE_BASE_URL: http://ocr-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://rendering-service:8000
    ports:
      - "${RENDERING_SERVICE_PORT:-8011}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      storage-service:
        condition: service_started
      document-service:
        condition: service_started
    networks:
      - dms-net

  # Optional (3.9, P5b-S5, ADR 0016): ocrEnabled=false bedeutet, dieser
  # Container wird gar nicht erst deployt (Compose-Profil-Opt-out) statt
  # laufend "aus" zu sein - konsistent mit dem "Dazustellen"-Prinzip. Aktiv,
  # sobald das Profil "ocr" eingeschaltet ist (siehe COMPOSE_PROFILES in
  # .env.example, standardmäßig aktiv). rendering-service/search-service
  # hängen deshalb bewusst NICHT per depends_on an diesem Service - beide
  # tolerieren seine Abwesenheit bereits über ihre HTTP-Clients
  # (search-service: schon vorhandenes try/except; rendering-service: neu in
  # dieser Session ergänzt, siehe consumer.py).
  ocr-service:
    build:
      context: ..
      dockerfile: services/ocr-service/Dockerfile
    restart: unless-stopped
    profiles: ["ocr"]
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://ocr-service:8000
    ports:
      - "${OCR_SERVICE_PORT:-8012}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      storage-service:
        condition: service_started
      document-service:
        condition: service_started
    networks:
      - dms-net

  search-service:
    build:
      context: ..
      dockerfile: services/search-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_FOLDER_SERVICE_BASE_URL: http://folder-service:8000
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_OCR_SERVICE_BASE_URL: http://ocr-service:8000
      DMS_RENDERING_SERVICE_BASE_URL: http://rendering-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://search-service:8000
    ports:
      - "${SEARCH_SERVICE_PORT:-8013}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      document-service:
        condition: service_started
      folder-service:
        condition: service_started
      object-type-service:
        condition: service_started
      permission-service:
        condition: service_started
      rendering-service:
        condition: service_started
    networks:
      - dms-net

  workflow-service:
    build:
      context: ..
      dockerfile: services/workflow-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://workflow-service:8000
      DMS_SLA_POLL_INTERVAL_SECONDS: ${WORKFLOW_SLA_POLL_INTERVAL_SECONDS:-30}
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_SIGNATURE_SERVICE_BASE_URL: http://signature-service:8000
      # Federation Hub (7.4, P6-S9) - in diesem gebündelten Dev-Stack per
      # Default aktiv (der mitgelieferte `federation-hub-service` läuft
      # sowieso), damit der Selbst-Loopback-Smoke-Test ohne manuellen Schritt
      # funktioniert. Eine echte Installation würde diese Variable schlicht
      # leer lassen (opt-in, siehe docs/services/workflow-service.md).
      DMS_FEDERATION_HUB_BASE_URL: ${WORKFLOW_SERVICE_FEDERATION_HUB_BASE_URL:-http://federation-hub-service:8000}
      DMS_INSTALLATION_GATEWAY_BASE_URL: http://gateway-service:8000
      DMS_INSTALLATION_DISPLAY_NAME: ${WORKFLOW_SERVICE_INSTALLATION_DISPLAY_NAME:-DMS-Dev-Installation}
      DMS_FEDERATION_PROCESS_TYPE_MAP: ${WORKFLOW_SERVICE_FEDERATION_PROCESS_TYPE_MAP:-{}}
    ports:
      - "${WORKFLOW_SERVICE_PORT:-8014}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      permission-service:
        condition: service_started
      signature-service:
        condition: service_started
      federation-hub-service:
        condition: service_started
    networks:
      - dms-net

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://notification-service:8000
      DMS_SMTP_HOST: mailpit
      DMS_SMTP_PORT: "1025"
      DMS_AUTH_SERVICE_BASE_URL: http://auth-service:8000
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8015}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      mailpit:
        condition: service_started
      auth-service:
        condition: service_started
    networks:
      - dms-net

  case-service:
    build:
      context: ..
      dockerfile: services/case-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_WORKFLOW_SERVICE_BASE_URL: http://workflow-service:8000
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://case-service:8000
    ports:
      - "${CASE_SERVICE_PORT:-8016}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      workflow-service:
        condition: service_started
      document-service:
        condition: service_started
      object-type-service:
        condition: service_started
    networks:
      - dms-net

  signature-service:
    build:
      context: ..
      dockerfile: services/signature-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      DMS_AUTH_SERVICE_BASE_URL: http://auth-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://signature-service:8000
    ports:
      - "${SIGNATURE_SERVICE_PORT:-8017}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      document-service:
        condition: service_started
      object-type-service:
        condition: service_started
      auth-service:
        condition: service_started
    networks:
      - dms-net

  # Federation Hub (Konzept 7.4, P6-S9): bewusst KEIN interner Service dieser
  # Installation (siehe docs/services/federation-hub-service.md) - kein
  # `DMS_REGISTRY_SERVICE_BASE_URL`/`DMS_SELF_ADDRESS`, kein `depends_on` von
  # `gateway-service`. Wird hier nur der lokalen Entwicklung/dem
  # Selbst-Loopback-Smoke-Test halber mitgeliefert (ADR 0028) - ein Betreiber
  # würde ihn in Produktion vollständig separat betreiben, ggf. sogar für
  # mehrere fremde Installationen gemeinsam.
  federation-hub-service:
    build:
      context: ..
      dockerfile: services/federation-hub-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
    ports:
      - "${FEDERATION_HUB_SERVICE_PORT:-8018}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dms-net

  favorite-service:
    build:
      context: ..
      dockerfile: services/favorite-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://favorite-service:8000
    ports:
      - "${FAVORITE_SERVICE_PORT:-8019}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - dms-net

  reporting-service:
    build:
      context: ..
      dockerfile: services/reporting-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://reporting-service:8000
      DMS_WORKFLOW_SERVICE_BASE_URL: http://workflow-service:8000
      DMS_AUDIT_SERVICE_BASE_URL: http://audit-service:8000
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8000
      # Extern erreichbare Gateway-Adresse fuer Downloadlinks in geplanten
      # Berichts-E-Mails (5.4a, seit P7-S2b) - bewusst nicht die interne
      # Docker-DNS-Adresse, siehe settings.py.
      DMS_GATEWAY_BASE_URL: ${REPORTING_SERVICE_GATEWAY_BASE_URL:-http://localhost:8009}
      DMS_REPORT_POLL_INTERVAL_SECONDS: ${REPORTING_SERVICE_POLL_INTERVAL_SECONDS:-3600}
    ports:
      - "${REPORTING_SERVICE_PORT:-8020}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      workflow-service:
        condition: service_started
      audit-service:
        condition: service_started
      storage-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - dms-net

  archival-service:
    build:
      context: ..
      dockerfile: services/archival-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://archival-service:8000
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_RENDERING_SERVICE_BASE_URL: http://rendering-service:8000
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      # XDOMEA-Aussonderung fuer Umlaufmappen (5.6, seit P7-S3b)
      DMS_CASE_SERVICE_BASE_URL: http://case-service:8000
      DMS_ARCHIVAL_POLL_INTERVAL_SECONDS: ${ARCHIVAL_SERVICE_POLL_INTERVAL_SECONDS:-3600}
      DMS_DEHYDRATION_DELAY_DAYS: ${ARCHIVAL_SERVICE_DEHYDRATION_DELAY_DAYS:-30}
      DMS_ARCHIVE_RETRIEVAL_ROLE: ${ARCHIVAL_SERVICE_RETRIEVAL_ROLE:-dms-admin}
      # Dev-/Testschluessel fuer `EnvKeyStore` (ADR 0029) - base64-kodierte
      # 32 Byte, NUR fuer lokale Entwicklung. Eine echte Installation setzt
      # dies über ein Secret oder betreibt ein eigenes `KeyStore`-Plugin.
      DMS_ARCHIVE_ENCRYPTION_KEY: ${ARCHIVAL_SERVICE_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    ports:
      - "${ARCHIVAL_SERVICE_PORT:-8021}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      document-service:
        condition: service_started
      rendering-service:
        condition: service_started
      storage-service:
        condition: service_started
      object-type-service:
        condition: service_started
      case-service:
        condition: service_started
    networks:
      - dms-net

  query-service:
    build:
      context: ..
      dockerfile: services/query-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://query-service:8000
      DMS_AUDIT_SERVICE_BASE_URL: http://audit-service:8000
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_AUTH_SERVICE_BASE_URL: http://auth-service:8000
      # ADR 0031: `pglast` (GPL-3.0-or-later) wird nicht mitgeliefert - leer
      # gelassen liefert `POST /query` 501, `GET /query/events` bleibt
      # unberuehrt nutzbar. Ein Betreiber traegt hier den Modulpfad seines
      # eigenen, separat installierten Plugins ein.
      DMS_QUERY_PARSER_PLUGIN_MODULE: ${QUERY_SERVICE_PARSER_PLUGIN_MODULE:-}
      # HMAC-Schluessel fuer Dry-Run-Tokens (6.1, seit P8-S2) - NUR fuer
      # lokale Entwicklung, gleiches Muster wie archival-service's
      # DMS_ARCHIVE_ENCRYPTION_KEY.
      DMS_DRY_RUN_SECRET: ${QUERY_SERVICE_DRY_RUN_SECRET:-dev-only-dry-run-secret-do-not-use-in-production}
    ports:
      - "${QUERY_SERVICE_PORT:-8022}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      audit-service:
        condition: service_started
      document-service:
        condition: service_started
      object-type-service:
        condition: service_started
      permission-service:
        condition: service_started
      auth-service:
        condition: service_started
    networks:
      - dms-net

  object-type-service:
    build:
      context: ..
      dockerfile: services/object-type-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://object-type-service:8000
    ports:
      - "${OBJECT_TYPE_SERVICE_PORT:-8007}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dms-net

  folder-service:
    build:
      context: ..
      dockerfile: services/folder-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://folder-service:8000
      # Aufbewahrung/Legal Hold/Zwangslöschung für Ordner (5.2/5.2a, seit
      # P7-S1b): Kaskaden-Aufrufe an document-service (kein depends_on hier
      # möglich - document-service hängt selbst bereits von folder-service
      # ab, ein zyklisches depends_on ist in docker-compose nicht zulässig;
      # der HTTP-Client toleriert das, da nur zur Aufrufzeit gebraucht),
      # Vier-Augen-Prinzip über permission-service, Poll-Intervall wie
      # document-service's `retention_poll_interval_seconds` (P7-S1).
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_RETENTION_POLL_INTERVAL_SECONDS: ${FOLDER_SERVICE_RETENTION_POLL_INTERVAL_SECONDS:-3600}
    ports:
      - "${FOLDER_SERVICE_PORT:-8008}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      object-type-service:
        condition: service_started
      permission-service:
        condition: service_started
    networks:
      - dms-net

  gateway-service:
    build:
      context: ..
      dockerfile: services/gateway-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_KEYCLOAK_BASE_URL: http://keycloak:8080
      DMS_KEYCLOAK_CLIENT_ID: dms-api
      DMS_RATE_LIMIT_MAX_REQUESTS: ${GATEWAY_SERVICE_RATE_LIMIT_MAX_REQUESTS:-120}
      DMS_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_SERVICE_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Vom Browser aus erreichbare Frontend-Origins (CORS) - bei geänderten
      # USER_UI_PORT/ADMIN_UI_PORT entsprechend mit anpassen.
      DMS_CORS_ALLOWED_ORIGINS: ${GATEWAY_SERVICE_CORS_ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:3001"]}
    ports:
      - "${GATEWAY_SERVICE_PORT:-8009}:8000"
    depends_on:
      registry-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - dms-net

  user-ui:
    build:
      context: ..
      dockerfile: apps/user-ui/Dockerfile
      args:
        # Vom Browser aus erreichbare Adresse des Gateways (nicht die interne
        # Compose-DNS) - der Build brennt sie fest ein, siehe apps/user-ui/README.md.
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${USER_UI_GATEWAY_BASE_URL:-http://localhost:8009}
    restart: unless-stopped
    ports:
      - "${USER_UI_PORT:-3000}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net

  admin-ui:
    build:
      context: ..
      dockerfile: apps/admin-ui/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${ADMIN_UI_GATEWAY_BASE_URL:-http://localhost:8009}
    restart: unless-stopped
    ports:
      - "${ADMIN_UI_PORT:-3001}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net

  process-designer:
    build:
      context: ..
      dockerfile: apps/process-designer/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${PROCESS_DESIGNER_GATEWAY_BASE_URL:-http://localhost:8009}
    restart: unless-stopped
    ports:
      - "${PROCESS_DESIGNER_PORT:-3002}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net
