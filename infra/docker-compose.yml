      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://plugin-orchestration-service:8000
      DMS_AUTH_SERVICE_BASE_URL: http://auth-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
    ports:
      - "${PLUGIN_ORCHESTRATION_SERVICE_PORT:-8024}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      registry-service:
        condition: service_started
      auth-service:
        condition: service_started
      permission-service:
        condition: service_started
    networks:
      - dms-net

  monitoring-service:
    build:
      context: ..
      dockerfile: services/monitoring-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      # Scrape proxy (10.1, P11-S1): asks registry-service for all
      # currently active instances and itself calls their own /metrics
      # endpoints - Prometheus scrapes exclusively this service.
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://monitoring-service:8000
      DMS_AUTH_SERVICE_BASE_URL: http://auth-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
    ports:
      - "${MONITORING_SERVICE_PORT:-8026}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      registry-service:
        condition: service_started
      auth-service:
        condition: service_started
      permission-service:
        condition: service_started
    networks:
      - dms-net

  webdav-connector:
    build:
      context: ..
      dockerfile: services/webdav-connector/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      # No own Postgres/NATS schema (3.3, P12-S1): pure translator
      # between WebDAV and the existing folder-service/document-service
      # HTTP APIs, no own state.
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_FOLDER_SERVICE_BASE_URL: http://folder-service:8000
      DMS_AUTH_SERVICE_BASE_URL: http://auth-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://webdav-connector:8000
    ports:
      - "${WEBDAV_CONNECTOR_PORT:-8027}:8000"
    depends_on:
      document-service:
        condition: service_started
      folder-service:
        condition: service_started
      auth-service:
        condition: service_started
      registry-service:
        condition: service_started
    networks:
      - dms-net

  cmis-connector:
    build:
      context: ..
      dockerfile: services/cmis-connector/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      # No own Postgres/NATS schema (3.3, P12-S4), same pattern as
      # webdav-connector: pure translator between the self-built
      # CMIS 1.1 browser binding and the existing folder-service/
      # document-service HTTP APIs.
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_FOLDER_SERVICE_BASE_URL: http://folder-service:8000
      DMS_AUTH_SERVICE_BASE_URL: http://auth-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://cmis-connector:8000
      # Sensor concept (10.1, full rollout) - monitoring-service itself does
      # NOT depend on cmis-connector (no depends_on here), same pattern as
      # registry-service above.
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
    ports:
      - "${CMIS_CONNECTOR_PORT:-8030}:8000"
    depends_on:
      document-service:
        condition: service_started
      folder-service:
        condition: service_started
      auth-service:
        condition: service_started
      registry-service:
        condition: service_started
    networks:
      - dms-net

  mail-connector:
    build:
      context: ..
      dockerfile: services/mail-connector/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_VIRUS_SCAN_SERVICE_BASE_URL: http://virus-scan-service:8000
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_CASE_SERVICE_BASE_URL: http://case-service:8000
      # Format-derived candidate pattern (post-roadmap phase 19 session 11,
      # see ADR 0076) - without this variable the client in the container
      # falls back to the local dev default (`localhost:8007`), which points
      # nowhere there.
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      # Inbox/outbox (2.5/3.3, P15-S3): mailpit's own POP3 server serves
      # as the self-loopback source (see comment there) - credentials
      # must match `infra/mailpit-pop3-auth`.
      DMS_POP3_HOST: mailpit
      DMS_POP3_PORT: "1110"
      DMS_POP3_USERNAME: ${MAIL_CONNECTOR_POP3_USERNAME:-mailconnector}
      DMS_POP3_PASSWORD: ${MAIL_CONNECTOR_POP3_PASSWORD:-mailconnector}
      DMS_SMTP_HOST: mailpit
      DMS_SMTP_PORT: "1025"
      DMS_POSTSTELLE_ROLE: ${MAIL_CONNECTOR_POSTSTELLE_ROLE:-dms-poststelle}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://mail-connector:8000
      # Sensor concept (10.1, full rollout) - same fail-open pattern as
      # document-service/registry-service.
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
    ports:
      - "${MAIL_CONNECTOR_PORT:-8033}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      mailpit:
        condition: service_started
      storage-service:
        condition: service_started
      virus-scan-service:
        condition: service_started
      document-service:
        condition: service_started
      case-service:
        condition: service_started
      object-type-service:
        condition: service_started
    networks:
      - dms-net

  migration-service:
    build:
      context: ..
      dockerfile: services/migration-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://migration-service:8000
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_FOLDER_SERVICE_BASE_URL: http://folder-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_WORKFLOW_SERVICE_BASE_URL: http://workflow-service:8000
    ports:
      - "${MIGRATION_SERVICE_PORT:-8028}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      document-service:
        condition: service_started
      folder-service:
        condition: service_started
      permission-service:
        condition: service_started
      workflow-service:
        condition: service_started
      registry-service:
        condition: service_started
    networks:
      - dms-net

  config-service:
    build:
      context: ..
      dockerfile: services/config-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      # No own Postgres/NATS schema (7.3, P12-S3): pure translator,
      # reads/writes exclusively at the respective owner services.
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://config-service:8000
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      DMS_WORKFLOW_SERVICE_BASE_URL: http://workflow-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      # Realm role category (14.1, P17-S1).
      DMS_AUTH_SERVICE_BASE_URL: http://auth-service:8000
      # Fleet agent key (3a, P13-S2) - see license-service above,
      # same value (a fleet-management-service provisions both paths
      # via the same installation).
      DMS_FLEET_AGENT_API_KEY: ${DMS_FLEET_AGENT_API_KEY:-dev-fleet-agent-key}
      # Pure NATS consumer since P17-S3 (4.3/14.2, `permission.approval.approved`
      # for deferred `config.import`) - without this variable
      # `BaseServiceSettings` falls back to `nats://localhost:4222`, which
      # does not reach the `nats` service in the container (P17-S3 finding).
      DMS_NATS_URL: nats://nats:4222
    ports:
      - "${CONFIG_SERVICE_PORT:-8029}:8000"
    depends_on:
      nats:
        condition: service_healthy
      object-type-service:
        condition: service_started
      workflow-service:
        condition: service_started
      permission-service:
        condition: service_started
      monitoring-service:
        condition: service_started
      registry-service:
        condition: service_started
      auth-service:
        condition: service_started
    networks:
      - dms-net

  fleet-management-service:
    build:
      context: ..
      dockerfile: services/fleet-management-service/Dockerfile
    restart: unless-stopped
    environment:
      # Deliberately NO DMS_INSTALLATION_ID/DMS_REGISTRY_SERVICE_BASE_URL
      # (3a, P13-S2) - this service does not belong to any single
      # installation, see settings.py. Bundled in this stack nonetheless
      # only for local development/testing (analogous to
      # federation-hub-service, ADR 0028) - an operator would run it
      # separately.
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
    ports:
      - "${FLEET_MANAGEMENT_SERVICE_PORT:-8031}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dms-net

  teamspace-service:
    build:
      context: ..
      dockerfile: services/teamspace-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://teamspace-service:8000
      DMS_FOLDER_SERVICE_BASE_URL: http://folder-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
    ports:
      - "${TEAMSPACE_SERVICE_PORT:-8032}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      folder-service:
        condition: service_started
      permission-service:
        condition: service_started
    networks:
      - dms-net

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    # Explicit command re-states the image defaults (a custom command replaces
    # them entirely) plus --web.enable-remote-write-receiver, needed so k6's
    # experimental-prometheus-rw output (loadtest/) can push samples directly.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      monitoring-service:
        condition: service_started
    networks:
      - dms-net

  cadvisor:
    # Per-container CPU/memory/network metrics (loadtest/, resource-sizing
    # analysis) - none of the app services expose this themselves, cAdvisor
    # reads it straight from the container runtime instead of needing
    # per-service instrumentation. Labels its series with the container
    # name, which matches each service's docker-compose name.
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "${CADVISOR_PORT:-8034}:8080"
    networks:
      - dms-net

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      # Pure dev convenience (default login) - not a production target of
      # this stack, same trust level as POSTGRES_PASSWORD/dms_dev_only.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Concept 10.1: "provides sensible default dashboard definitions as
      # exportable JSON templates" - datasource + dashboard are provisioned
      # declaratively (see infra/grafana/provisioning/), no manual
      # clicking in the UI needed.
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - dms-net

  object-type-service:
    build:
      context: ..
      dockerfile: services/object-type-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://object-type-service:8000
      # Sensor concept (10.1, full rollout) - same fail-open pattern as
      # document-service/registry-service.
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
    ports:
      - "${OBJECT_TYPE_SERVICE_PORT:-8007}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dms-net

  folder-service:
    build:
      context: ..
      dockerfile: services/folder-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://folder-service:8000
      # Retention/legal hold/forced deletion for folders (5.2/5.2a, since
      # P7-S1b): cascading calls to document-service (no depends_on
      # possible here - document-service already itself depends on
      # folder-service, a cyclic depends_on is not allowed in
      # docker-compose; the HTTP client tolerates this since it's only
      # needed at call time), four-eyes principle via permission-service,
      # poll interval like document-service's
      # `retention_poll_interval_seconds` (P7-S1).
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_RETENTION_POLL_INTERVAL_SECONDS: ${FOLDER_SERVICE_RETENTION_POLL_INTERVAL_SECONDS:-3600}
    ports:
      - "${FOLDER_SERVICE_PORT:-8008}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      object-type-service:
        condition: service_started
      permission-service:
        condition: service_started
    networks:
      - dms-net

  gateway-service:
    build:
      context: ..
      dockerfile: services/gateway-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      # Self-registration (10.1, full rollout), new for gateway-service:
      # unlike every other service, nothing needs to *discover* the gateway
      # itself - this exists purely so monitoring-service's scrape-proxy can
      # find and scrape this instance's new /metrics endpoint.
      DMS_SELF_ADDRESS: http://gateway-service:8000
      # Sensor concept (10.1, full rollout) - monitoring-service itself does
      # NOT depend on gateway-service (no depends_on here), same pattern as
      # registry-service above.
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      DMS_KEYCLOAK_BASE_URL: http://keycloak:8080
      DMS_KEYCLOAK_CLIENT_ID: dms-api
      # Auth decoupling from Keycloak (phase 18, ADR 0063) - JWKS of local
      # technical accounts (superusers/domain admins), see
      # `_build_token_validator` in main.py.
      DMS_AUTH_SERVICE_BASE_URL: http://auth-service:8000
      DMS_RATE_LIMIT_MAX_REQUESTS: ${GATEWAY_SERVICE_RATE_LIMIT_MAX_REQUESTS:-600}
      DMS_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_SERVICE_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Shared rate-limit store (since P25-S3, ADR 0097) - internal Compose DNS,
      # see redis service above.
      DMS_REDIS_URL: redis://redis:6379/0
      # Frontend origins reachable from the browser (CORS) - adjust
      # accordingly when <APP>_PORT values change. Did not include
      # PROCESS_DESIGNER_PORT (3002) before P14-S2 (a real gap found and
      # cleaned up) - now all five frontend apps are fully listed.
      DMS_CORS_ALLOWED_ORIGINS: ${GATEWAY_SERVICE_CORS_ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:3002","http://localhost:3004","http://localhost:3005"]}
    ports:
      - "${GATEWAY_SERVICE_PORT:-8009}:8000"
    depends_on:
      registry-service:
        condition: service_started
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dms-net

  user-ui:
    build:
      context: ..
      dockerfile: apps/user-ui/Dockerfile
      args:
        # Address of the gateway reachable from the browser (not the internal
        # Compose DNS) - the build bakes it in permanently, see apps/user-ui/README.md.
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${USER_UI_GATEWAY_BASE_URL:-http://localhost:8009}
        # Direct Office editing (post-roadmap feature): address of
        # webdav-connector reachable from the browser - the browser talks
        # to this service directly for the Office URI scheme start URL.
        NEXT_PUBLIC_WEBDAV_CONNECTOR_BASE_URL: ${USER_UI_WEBDAV_CONNECTOR_BASE_URL:-http://localhost:8027}
    restart: unless-stopped
    ports:
      - "${USER_UI_PORT:-3000}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net

  admin-ui:
    build:
      context: ..
      dockerfile: apps/admin-ui/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${ADMIN_UI_GATEWAY_BASE_URL:-http://localhost:8009}
    restart: unless-stopped
    ports:
      - "${ADMIN_UI_PORT:-3001}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net

  process-designer:
    build:
      context: ..
      dockerfile: apps/process-designer/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${PROCESS_DESIGNER_GATEWAY_BASE_URL:-http://localhost:8009}
    restart: unless-stopped
    ports:
      - "${PROCESS_DESIGNER_PORT:-3002}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net

  reviewer-ui:
    build:
      context: ..
      dockerfile: apps/reviewer-ui/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${REVIEWER_UI_GATEWAY_BASE_URL:-http://localhost:8009}
    restart: unless-stopped
    ports:
      - "${REVIEWER_UI_PORT:-3005}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net

  migration-console:
    build:
      context: ..
      dockerfile: apps/migration-console/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${MIGRATION_CONSOLE_GATEWAY_BASE_URL:-http://localhost:8009}
    restart: unless-stopped
    ports:
      - "${MIGRATION_CONSOLE_PORT:-3004}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net

  office-addin:
    build:
      context: ..
      dockerfile: apps/office-addin/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${OFFICE_ADDIN_GATEWAY_BASE_URL:-http://localhost:8009}
        NEXT_PUBLIC_TEMPLATE_LIBRARY_FOLDER_NAME: ${OFFICE_ADDIN_TEMPLATE_LIBRARY_FOLDER_NAME:-Vorlagen}
    restart: unless-stopped
    ports:
      - "${OFFICE_ADDIN_PORT:-3006}:80"
    depends_on:
