      DMS_WORKFLOW_SERVICE_BASE_URL: http://workflow-service:8000
    ports:
      - "${MIGRATION_SERVICE_PORT:-8028}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      document-service:
        condition: service_started
      folder-service:
        condition: service_started
      permission-service:
        condition: service_started
      workflow-service:
        condition: service_started
      registry-service:
        condition: service_started
    networks:
      - dms-net

  config-service:
    build:
      context: ..
      dockerfile: services/config-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      # Kein eigenes Postgres-/NATS-Schema (7.3, P12-S3): reiner Übersetzer,
      # liest/schreibt ausschließlich bei den jeweiligen Owner-Services.
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://config-service:8000
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      DMS_WORKFLOW_SERVICE_BASE_URL: http://workflow-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      # Fleet-Agent-Schluessel (3a, P13-S2) - siehe license-service oben,
      # derselbe Wert (ein fleet-management-service provisioniert beide Wege
      # ueber dieselbe Installation).
      DMS_FLEET_AGENT_API_KEY: ${DMS_FLEET_AGENT_API_KEY:-dev-fleet-agent-key}
    ports:
      - "${CONFIG_SERVICE_PORT:-8029}:8000"
    depends_on:
      object-type-service:
        condition: service_started
      workflow-service:
        condition: service_started
      permission-service:
        condition: service_started
      monitoring-service:
        condition: service_started
      registry-service:
        condition: service_started
    networks:
      - dms-net

  fleet-management-service:
    build:
      context: ..
      dockerfile: services/fleet-management-service/Dockerfile
    restart: unless-stopped
    environment:
      # Bewusst KEIN DMS_INSTALLATION_ID/DMS_REGISTRY_SERVICE_BASE_URL (3a,
      # P13-S2) - dieser Service gehoert zu keiner einzelnen Installation,
      # siehe settings.py. Nur der lokalen Entwicklung/dem Testen halber
      # trotzdem in diesem Stack mitgeliefert (analog federation-hub-service,
      # ADR 0028) - ein Betreiber wuerde ihn separat betreiben.
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
    ports:
      - "${FLEET_MANAGEMENT_SERVICE_PORT:-8031}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dms-net

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      monitoring-service:
        condition: service_started
    networks:
      - dms-net

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      # Reine Dev-Bequemlichkeit (Default-Login) - kein Produktions-Ziel dieses
      # Stacks, gleiche Vertrauensstellung wie POSTGRES_PASSWORD/dms_dev_only.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Konzept 10.1: "liefert sinnvolle Default-Dashboard-Definitionen als
      # exportierbare JSON-Vorlagen" - Datasource + Dashboard werden deklarativ
      # provisioniert (siehe infra/grafana/provisioning/), kein manuelles
      # Klicken in der UI nötig.
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - dms-net

  object-type-service:
    build:
      context: ..
      dockerfile: services/object-type-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://object-type-service:8000
    ports:
      - "${OBJECT_TYPE_SERVICE_PORT:-8007}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dms-net

  folder-service:
    build:
      context: ..
      dockerfile: services/folder-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://folder-service:8000
      # Aufbewahrung/Legal Hold/Zwangslöschung für Ordner (5.2/5.2a, seit
      # P7-S1b): Kaskaden-Aufrufe an document-service (kein depends_on hier
      # möglich - document-service hängt selbst bereits von folder-service
      # ab, ein zyklisches depends_on ist in docker-compose nicht zulässig;
      # der HTTP-Client toleriert das, da nur zur Aufrufzeit gebraucht),
      # Vier-Augen-Prinzip über permission-service, Poll-Intervall wie
      # document-service's `retention_poll_interval_seconds` (P7-S1).
      DMS_DOCUMENT_SERVICE_BASE_URL: http://document-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_RETENTION_POLL_INTERVAL_SECONDS: ${FOLDER_SERVICE_RETENTION_POLL_INTERVAL_SECONDS:-3600}
    ports:
      - "${FOLDER_SERVICE_PORT:-8008}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      object-type-service:
        condition: service_started
      permission-service:
        condition: service_started
    networks:
      - dms-net

  gateway-service:
    build:
      context: ..
      dockerfile: services/gateway-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_KEYCLOAK_BASE_URL: http://keycloak:8080
      DMS_KEYCLOAK_CLIENT_ID: dms-api
      DMS_RATE_LIMIT_MAX_REQUESTS: ${GATEWAY_SERVICE_RATE_LIMIT_MAX_REQUESTS:-600}
      DMS_RATE_LIMIT_WINDOW_SECONDS: ${GATEWAY_SERVICE_RATE_LIMIT_WINDOW_SECONDS:-60}
      # Vom Browser aus erreichbare Frontend-Origins (CORS) - bei geänderten
      # <APP>_PORT-Werten entsprechend mit anpassen. Enthielt vor P14-S2
      # PROCESS_DESIGNER_PORT (3002) nicht (real gefundene, mit aufgeräumte
      # Lücke) - jetzt alle fünf Frontend-Apps vollständig gelistet.
      DMS_CORS_ALLOWED_ORIGINS: ${GATEWAY_SERVICE_CORS_ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:3001","http://localhost:3002","http://localhost:3004","http://localhost:3005"]}
    ports:
      - "${GATEWAY_SERVICE_PORT:-8009}:8000"
    depends_on:
      registry-service:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - dms-net

  user-ui:
    build:
      context: ..
      dockerfile: apps/user-ui/Dockerfile
      args:
        # Vom Browser aus erreichbare Adresse des Gateways (nicht die interne
        # Compose-DNS) - der Build brennt sie fest ein, siehe apps/user-ui/README.md.
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${USER_UI_GATEWAY_BASE_URL:-http://localhost:8009}
    restart: unless-stopped
    ports:
      - "${USER_UI_PORT:-3000}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net

  admin-ui:
    build:
      context: ..
      dockerfile: apps/admin-ui/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${ADMIN_UI_GATEWAY_BASE_URL:-http://localhost:8009}
    restart: unless-stopped
    ports:
      - "${ADMIN_UI_PORT:-3001}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net

  process-designer:
    build:
      context: ..
      dockerfile: apps/process-designer/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${PROCESS_DESIGNER_GATEWAY_BASE_URL:-http://localhost:8009}
    restart: unless-stopped
    ports:
      - "${PROCESS_DESIGNER_PORT:-3002}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net

  reviewer-ui:
    build:
      context: ..
      dockerfile: apps/reviewer-ui/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${REVIEWER_UI_GATEWAY_BASE_URL:-http://localhost:8009}
    restart: unless-stopped
    ports:
      - "${REVIEWER_UI_PORT:-3005}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net

  migration-console:
    build:
      context: ..
      dockerfile: apps/migration-console/Dockerfile
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${MIGRATION_CONSOLE_GATEWAY_BASE_URL:-http://localhost:8009}
    restart: unless-stopped
    ports:
      - "${MIGRATION_CONSOLE_PORT:-3004}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - dms-net
