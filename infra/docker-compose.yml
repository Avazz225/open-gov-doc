# Local dev base infrastructure (concept 3.1/3.4/3.6/4.4) + domain services,
# added incrementally per the roadmap (../IMPLEMENTATION_PLAN.md).
#
# Usage:
#   cp .env.example .env
#   docker compose up -d

name: dms

networks:
  dms-net:
    driver: bridge

volumes:
  postgres-data:
  # WAL archiving for point-in-time recovery (10.4, P11-S3) - separate
  # volume instead of a subfolder in postgres-data, so a restore script can
  # mount the archive independently of the (possibly discarded) live data
  # directory.
  postgres-wal-archive:
  nats-data:
  keycloak-data:
  minio-data:
  # Azure Blob emulator (Azurite) for storage-service (post-roadmap phase 24
  # session 1) - analogous to minio-data, its own volume per emulated provider.
  azurite-data:
  # Stands in for the PVC mount point in a real installation (concept 3.6) -
  # whether NFS or a block volume is behind it is invisible to storage-service.
  storage-local-data:
  # Separate archive target (5.6, since P7-S3) - own volume, since a
  # `role="archive"` target is typically a different/cheaper backend than
  # the live targets per the concept, simulated here as a stand-in second
  # local directory.
  storage-archive-data:
  # Grafana's own SQLite DB (sessions, users) - dashboards/datasource
  # themselves come declaratively from infra/grafana/ (provisioning), this
  # volume only persists other Grafana-internal state across restarts.
  grafana-data:
  # Deletion register ledger (10.4, P11-S4) - see audit-service comment above.
  deletion-ledger-data:

services:
  # A freshly created Docker volume initially belongs to root - the
  # postgres process (user `postgres`) can then not write to /wal-archive
  # (a real failure discovered live on first start: "cp: can't create
  # '/wal-archive/...': Permission denied"). This one-off init service fixes
  # that reproducibly on every `docker compose up`, instead of requiring a
  # manual `chown` step.
  postgres-wal-archive-init:
    image: postgres:16-alpine
    user: root
    command: ["sh", "-c", "chown -R postgres:postgres /wal-archive"]
    volumes:
      - postgres-wal-archive:/wal-archive
    networks:
      - dms-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # WAL archiving (10.4, P11-S3) - simplest officially documented pattern
    # (`cp` archive command, no pgBackRest/Barman needed): every completed WAL
    # segment additionally lands permanently under /wal-archive (its own
    # volume) alongside the live pg_wal/ - the basis for point-in-time
    # recovery in scripts/backup.sh/restore.sh. `test ! -f ...` makes the
    # command idempotent (Postgres retries archive_command on failures).
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
      - -c
      - max_wal_senders=3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dms_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-dms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres-wal-archive:/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dms}"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres-wal-archive-init:
        condition: service_completed_successfully
    networks:
      - dms-net

  # Keycloak uses the same Postgres instance (concept 10.4) — its own schema, no separate DB server.
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dms}?currentSchema=keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-dms}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-dms_dev_only}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl/wget in the Keycloak image - raw HTTP check via bash /dev/tcp
      # against the public realm endpoint (no health extension needed).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/master HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - dms-net

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dms-net

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dms_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dms_minio_dev_only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dms-net

  # Azure Blob emulator for storage-service (post-roadmap phase 24 session 1,
  # concept 1a) - Azurite stands in analogously to MinIO above for the real
  # provider (real Azure Blob Storage), `AzureBlobBackend` works identically
  # against both. Fixed, publicly documented Azurite dev account
  # ("devstoreaccount1"), not a real secret - see
  # docs/services/storage-service.md. Only the blob port (10000) is exposed,
  # queue/table (10001/10002) are not needed by storage-service.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.30.0
    restart: unless-stopped
    # --skipApiVersionCheck: the pinned Azurite image may not yet know the
    # latest API version (`x-ms-version`) sent by the `azure-storage-blob`
    # SDK - otherwise Azurite hard-rejects unknown but actually
    # backward-compatible versions with 400 "InvalidHeaderValue". Official
    # Azurite CLI flag for exactly this case, no security risk in this
    # pure dev/test emulation.
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "${AZURITE_BLOB_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dms-net

  # Dev SMTP test server for notification-service (P6-S2, concept 7.1) - catches every
  # mail, no real sending, web UI for checking under MAILPIT_UI_PORT. No
  # healthcheck needed, since no other service hard-waits on it at startup -
  # a single failed email delivery attempt just stays "failed"
  # (see docs/services/notification-service.md), not a blocker for service startup.
  mailpit:
    image: axllent/mailpit:v1.30.6
    restart: unless-stopped
    # POP3 server (since mailpit v1.15, disabled by default - only
    # `--pop3-auth-file` enables it) serves `mail-connector` (2.5/3.3,
    # P15-S3) as a self-loopback source: the same delivered mail can be
    # picked up again via a real standard protocol, without needing an
    # external mail server - same principle as the federation hub
    # self-loopback (P6-S9). Credentials (dev-only, plaintext file as
    # everywhere else in this repo) must match `mail-connector`'s
    # `DMS_POP3_USERNAME`/`DMS_POP3_PASSWORD`.
    command: ["--pop3", "[::]:1110", "--pop3-auth-file", "/data/pop3-auth"]
    volumes:
      - ./mailpit-pop3-auth:/data/pop3-auth:ro
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_POP3_PORT:-1110}:1110"
    networks:
      - dms-net

  # Shared store for gateway rate limiting (3.5, since P25-S3, ADR 0097) -
  # sole consumer currently `gateway-service`. Enables horizontal scaling
  # of the gateway: all instances see the same sliding-window counter per
  # client, instead of each maintaining (as before, ADR 0005) its own,
  # independent in-process limit. No volume, and persistence deliberately
  # disabled (`--save ""`, no AOF) - the rate-limit data is purely
  # transient (TTL per client key, see `RateLimiter`), a restart of Redis
  # itself harmlessly resets the limit, unlike e.g. NATS JetStream or
  # Postgres.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dms-net

  registry-service:
    build:
      context: ..
      dockerfile: services/registry-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      # Registers itself since P4-S3 with itself, so the gateway can also
      # resolve "registry-service" as a service_type (e.g. admin UI).
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://registry-service:8000
      # License brokering (concept 3.2b/9.3, P9-S2) - license-service
      # itself does NOT depend on registry-service (only env var, no
      # depends_on), so no cycle results here.
      DMS_LICENSE_SERVICE_BASE_URL: http://license-service:8000
      # Deliberately empty in this bundled dev/test stack (the code default
      # is {"workflow-service": "demo"}): without a license issuance tool
      # (ADR 0032), a valid license is never installed in this environment -
      # the production default would permanently put workflow-service into
      # demo mode and break other services' integration tests that write
      # for real against the running workflow-service container (see
      # case-service). A real installation does not override this variable
      # (uses the code default).
      DMS_LICENSABLE_COMPONENTS: ${REGISTRY_SERVICE_LICENSABLE_COMPONENTS:-{}}
      # Sensor concept (10.1, P11-S1) - monitoring-service itself does NOT
      # depend on registry-service (no depends_on here), so no cycle
      # results, same pattern as with license-service above.
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
    ports:
      - "${REGISTRY_SERVICE_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      license-service:
        condition: service_started
    networks:
      - dms-net

  audit-service:
    build:
      context: ..
      dockerfile: services/audit-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      # Self-registration with the registry (3.2a, since P4-S1) - basis for
      # gateway routing (3.5). Address is the internal Compose DNS name
      # under which other containers reach this service.
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://audit-service:8000
    volumes:
      # Deletion register ledger (10.4, P11-S4) - own volume, deliberately
      # separated from the shared Postgres instance, so a DB restore
      # (scripts/restore.sh) does not roll it back too.
      - deletion-ledger-data:/deletion-ledger
    ports:
      - "${AUDIT_SERVICE_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - dms-net

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      DMS_KEYCLOAK_BASE_URL: http://keycloak:8080
      # SSO/automatic login (post-roadmap feature): `GET /oidc/authorize`
      # returns a URL that the BROWSER navigates to - the internal
      # Compose hostname `keycloak` is not resolvable for that, the browser
      # needs the externally mapped port (see `KEYCLOAK_PORT` above).
      DMS_KEYCLOAK_PUBLIC_BASE_URL: http://localhost:${KEYCLOAK_PORT:-8080}
      DMS_KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      DMS_KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_only}
      DMS_KEYCLOAK_CLIENT_SECRET: ${AUTH_SERVICE_CLIENT_SECRET:-dms-api-dev-secret}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://auth-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_NATS_URL: nats://nats:4222
      # Directory/contacts (2.5/4.4, P15-S4) - first own Postgres schema
      # of this service (federation identity for the optional federated
      # contact search, see below).
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      # Federated contact search (7.4) - own registration, independent of
      # workflow-service's federation hub participation (ADR 0054). No
      # `depends_on: federation-hub-service` (registration is best-effort,
      # not a hard dependency of this installation, same principle as
      # workflow-service's own registration).
      DMS_FEDERATION_HUB_BASE_URL: ${AUTH_SERVICE_FEDERATION_HUB_BASE_URL:-http://federation-hub-service:8000}
      DMS_FEDERATED_DIRECTORY_ENABLED: ${AUTH_SERVICE_FEDERATED_DIRECTORY_ENABLED:-true}
      DMS_INSTALLATION_GATEWAY_BASE_URL: ${INSTALLATION_GATEWAY_BASE_URL:-http://gateway-service:8000}
    ports:
      - "${AUTH_SERVICE_PORT:-8003}:8000"
    depends_on:
      keycloak:
        condition: service_healthy
      permission-service:
        condition: service_started
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dms-net

  permission-service:
    build:
      context: ..
      dockerfile: services/permission-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://permission-service:8000
      # No `depends_on: auth-service` here (would form a cycle with
      # auth-service's `depends_on: permission-service` from P6-S5, Docker
      # Compose forbids that). Uncritical: the call only happens on
      # `POST /maintenance-mode/lift` at runtime, not during its own startup.
      DMS_AUTH_SERVICE_BASE_URL: http://auth-service:8000
    ports:
      - "${PERMISSION_SERVICE_PORT:-8004}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - dms-net

  storage-service:
    build:
      context: ..
      dockerfile: services/storage-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      # Target set (3.6, since P5b-S6 a real list instead of fixed backend/
      # secondary_backend slots - see ADR 0004/0017): default a single
      # local target (stands in for NFS/PVC mount). Any number of targets,
      # even of the same type, is possible, e.g. to test redundancy/quorum:
      #   STORAGE_SERVICE_TARGETS='[{"id":"local","type":"local","base_path":"/data/storage"},
      #     {"id":"s3-minio","type":"s3","endpoint_url":"http://minio:9000",
      #      "access_key":"dms_minio","secret_key":"dms_minio_dev_only",
      #      "bucket":"dms-storage","region":"us-east-1"}]'
      #   STORAGE_SERVICE_WRITE_STRATEGY=quorum STORAGE_SERVICE_QUORUM_COUNT=2
      # Azure target against the Azurite emulator (post-roadmap phase 24 session 1)
      # - fixed, publicly documented Azurite dev connection string
      # ("devstoreaccount1"), not a real secret, see
      # docs/services/storage-service.md:
      #   STORAGE_SERVICE_TARGETS='[{"id":"local","type":"local","base_path":"/data/storage"},
      #     {"id":"azure-azurite","type":"azure","container":"dms-storage",
      #      "connection_string":"DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;
      #      AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/
      #      K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"}]'
      # Env var values are not expanded further - MinIO credentials in a
      # custom STORAGE_SERVICE_TARGETS override must therefore be entered
      # literally, not as a ${MINIO_ROOT_USER} reference.
      # Second target with `role: archive` (5.6, since P7-S3) - not part of
      # the regular upload replication (`resolve_targets` filters it out),
      # only reachable via the dedicated `.../archive-copy` endpoints.
      DMS_TARGETS: >-
        ${STORAGE_SERVICE_TARGETS:-[{"id":"local","type":"local","base_path":"/data/storage"},
        {"id":"archive","type":"local","base_path":"/data/archive","role":"archive"}]}
      DMS_WRITE_STRATEGY: ${STORAGE_SERVICE_WRITE_STRATEGY:-primary_async}
      DMS_QUORUM_COUNT: ${STORAGE_SERVICE_QUORUM_COUNT:-1}
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://storage-service:8000
      # Sensor concept (10.1, full rollout) - same fail-open pattern as
      # document-service/registry-service.
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      # Role for the governance-mode bypass on forced deletion (5.2a, since
      # P7-S1) - must match document-service's `DOCUMENT_SERVICE_GOVERNANCE_
      # BYPASS_ROLE`, see ADR 0030.
      DMS_GOVERNANCE_BYPASS_ROLE: ${STORAGE_SERVICE_GOVERNANCE_BYPASS_ROLE:-dms-admin}
    volumes:
      - storage-local-data:/data/storage
      - storage-archive-data:/data/archive
    ports:
      - "${STORAGE_SERVICE_PORT:-8005}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - dms-net

  document-service:
    build:
      context: ..
      dockerfile: services/document-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_FOLDER_SERVICE_BASE_URL: http://folder-service:8000
      DMS_OBJECT_TYPE_SERVICE_BASE_URL: http://object-type-service:8000
      DMS_VIRUS_SCAN_SERVICE_BASE_URL: http://virus-scan-service:8000
      DMS_PERMISSION_SERVICE_BASE_URL: http://permission-service:8000
      DMS_REGISTRY_SERVICE_BASE_URL: http://registry-service:8000
      DMS_SELF_ADDRESS: http://document-service:8000
      # License limit block on new creations (concept 9.3, P9-S2). Deliberately
      # without depends_on: license-service itself depends on document-service
      # (document counter, P9-S1) - a reverse depends_on would be a
      # cycle. The check is fail-open anyway (TTL cache), not a hard
      # dependency at startup.
      DMS_LICENSE_SERVICE_BASE_URL: http://license-service:8000
      # Retention/legal hold/forced deletion (5.2/5.2a, since P7-S1): how
      # often the poll loop checks due deadlines, plus the role for the
      # governance bypass on forced deletion (must match storage-service's
      # `STORAGE_SERVICE_GOVERNANCE_BYPASS_ROLE`, see ADR 0030).
      DMS_RETENTION_POLL_INTERVAL_SECONDS: ${DOCUMENT_SERVICE_RETENTION_POLL_INTERVAL_SECONDS:-3600}
      DMS_GOVERNANCE_BYPASS_ROLE: ${DOCUMENT_SERVICE_GOVERNANCE_BYPASS_ROLE:-dms-admin}
      # Sensor concept (10.1, P11-S1) - no depends_on, same fail-open
      # pattern as the license client above.
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
    ports:
      - "${DOCUMENT_SERVICE_PORT:-8006}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      storage-service:
        condition: service_started
      folder-service:
        condition: service_started
      object-type-service:
        condition: service_started
      virus-scan-service:
        condition: service_started
      permission-service:
        condition: service_started
    networks:
      - dms-net

  virus-scan-service:
    build:
      context: ..
      dockerfile: services/virus-scan-service/Dockerfile
    restart: unless-stopped
    environment:
      DMS_INSTALLATION_ID: ${DMS_INSTALLATION_ID:-local-dev}
      DMS_INSTALLATION_DISPLAY_NAME: ${DMS_INSTALLATION_DISPLAY_NAME:-DMS-Installation (Entwicklung)}
      DMS_MONITORING_SERVICE_BASE_URL: http://monitoring-service:8000
      DMS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-dms}:${POSTGRES_PASSWORD:-dms_dev_only}@postgres:5432/${POSTGRES_DB:-dms}
      DMS_NATS_URL: nats://nats:4222
      DMS_STORAGE_SERVICE_BASE_URL: http://storage-service:8000
      DMS_SCAN_ENGINE: ${VIRUS_SCAN_ENGINE:-eicar}
