      DMS_ARCHIVE_ENCRYPTION_KEY: ${ARCHIVAL_SERVICE_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
